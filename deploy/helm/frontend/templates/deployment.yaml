apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "revenue-assurance-dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "revenue-assurance-dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "revenue-assurance-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "revenue-assurance-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "revenue-assurance-dashboard.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: revenue-assurance-dashboard
          image: "{{ .Values.image.registry }}/{{ .Release.Namespace }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: BACKEND_URL
              value: {{ .Values.backendUrl | quote }}

          {{- if .Values.staticAssets.enabled }}
          volumeMounts:
            - name: static-assets
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          {{- end }}

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

      {{- if .Values.staticAssets.enabled }}
      volumes:
        - name: static-assets
          configMap:
            name: {{ .Values.staticAssets.configMap }}
        - name: nginx-config
          configMap:
            name: {{ .Values.staticAssets.nginxConfigMap }}
      {{- end }}

      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
