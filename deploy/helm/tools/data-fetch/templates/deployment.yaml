apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-fetch-tool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-fetch-tool.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "data-fetch-tool.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data-fetch-tool.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: data-fetch-tool
          image: "{{ .Values.image.registry }}/{{ .Release.Namespace }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-fetch-tool.secretName" . }}
                  key: {{ include "data-fetch-tool.secretKey" . }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
