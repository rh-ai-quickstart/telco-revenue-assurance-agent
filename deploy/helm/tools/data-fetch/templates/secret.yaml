{{- if not .Values.database.existingSecret }}
{{- if and .Values.database.host .Values.database.username .Values.database.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-fetch-tool.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-fetch-tool.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.database.username }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
{{- else }}
{{- fail "Either database.existingSecret must be set, or database.host + database.username + database.password must all be provided." }}
{{- end }}
{{- end }}
