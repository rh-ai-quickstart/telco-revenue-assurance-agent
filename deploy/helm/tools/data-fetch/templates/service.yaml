apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-fetch-tool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-fetch-tool.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "data-fetch-tool.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
