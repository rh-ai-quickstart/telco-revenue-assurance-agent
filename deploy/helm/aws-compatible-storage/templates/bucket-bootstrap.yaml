{{- if .Values.buckets.create }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aws-compatible-storage.fullname" . }}-bucket-bootstrap
  labels:
    app.kubernetes.io/name: {{ include "aws-compatible-storage.fullname" . }}-bucket-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aws-compatible-storage.fullname" . }}-bucket-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ .Values.jobImages.python }}
          env:
            - name: HOME
              value: /tmp
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "aws-compatible-storage.secretName" . }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aws-compatible-storage.secretName" . }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_ENDPOINT
              value: "http://{{ include "aws-compatible-storage.fullname" . }}:{{ include "aws-compatible-storage.apiPort" . }}"
            - name: S3_BUCKETS
              value: {{ .Values.buckets.names | join "," | quote }}
            - name: S4_UI_ENDPOINT
              value: "http://{{ include "aws-compatible-storage.fullname" . }}:{{ include "aws-compatible-storage.uiPort" . }}/api"
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting for S4 UI..."
              python3 - <<'PYEOF'
              import os, time, urllib.request, urllib.error
              url = os.environ["S4_UI_ENDPOINT"]
              while True:
                  try:
                      urllib.request.urlopen(url, timeout=5)
                      print("S4 is up.")
                      break
                  except Exception:
                      print(f"Waiting for {url}...")
                      time.sleep(5)
              PYEOF
              echo "Installing boto3..."
              pip install --no-cache-dir -q boto3
              echo "Creating buckets: $S3_BUCKETS"
              python3 - <<'PYEOF'
              import os, boto3, botocore
              s3 = boto3.client(
                  "s3",
                  endpoint_url=os.environ["S3_ENDPOINT"],
                  aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
                  aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
                  region_name="us-east-1",
                  config=botocore.config.Config(signature_version="s3v4"),
              )
              for bucket in os.environ["S3_BUCKETS"].split(","):
                  bucket = bucket.strip()
                  try:
                      s3.create_bucket(Bucket=bucket)
                      print(f"Created bucket: {bucket}")
                  except botocore.exceptions.ClientError as e:
                      code = e.response["Error"]["Code"]
                      if code in ("BucketAlreadyOwnedByYou", "BucketAlreadyExists"):
                          print(f"Bucket already exists: {bucket}")
                      else:
                          raise
              for bucket in os.environ["S3_BUCKETS"].split(","):
                  bucket = bucket.strip()
                  s3.head_bucket(Bucket=bucket)
                  print(f"Verified: {bucket}")
              PYEOF
{{- end }}
