apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-prediction
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: "true"
  annotations:
    modelFormat: onnx
    opendatahub.io/connection-path: models/fraud
    opendatahub.io/connections: my-data-connection
    opendatahub.io/hardware-profile-name: default-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: predictive
    openshift.io/display-name: fraud-prediction
    security.opendatahub.io/enable-auth: "true"
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: RollingUpdate
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: onnx
        version: "1"
      name: ""
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: "2"
          memory: 4Gi
      runtime: fraud-prediction
      storage:
        key: my-data-connection
        path: models/fraud
    serviceAccountName: my-data-connection-sa
    timeout: 30
