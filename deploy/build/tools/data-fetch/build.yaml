apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: data-fetch-tool
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: data-fetch-tool
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: data-fetch-tool:latest
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
