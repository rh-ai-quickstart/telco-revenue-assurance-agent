apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: telco-backend
---
# Build context is the repo root so that agent/ is accessible alongside backend/.
# Start with: oc start-build telco-backend --from-dir=. --follow -n <namespace>
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: telco-backend
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: backend/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: telco-backend:latest
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
