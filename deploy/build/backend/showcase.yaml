---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
# Adjust OGX_URL to match the actual LlamaStack/OGX service name in the cluster.
# DATABASE_URL is supplied via the existing PostgreSQL secret (my-data-connection
# or telco-pgvector-secret) — not stored here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: showcase
data:
  OGX_URL: "http://ogx-ai:8321"
  OGX_MODEL_ID: "remote-llm/meta-llama/Llama-3.1-8B-Instruct"
  PREPROCESSING_URL: "http://predictor:8080"
  DATA_FETCH_URL: "http://data-fetch-tool-data-fetch-tool.showcase.svc:8080"
---
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: showcase
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/showcase/telco-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret    # adjust to your PostgreSQL secret name
                  key: DATABASE_URL

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: showcase
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# ── Route (OpenShift ingress) ─────────────────────────────────────────────────
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend
  namespace: showcase
spec:
  to:
    kind: Service
    name: backend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
