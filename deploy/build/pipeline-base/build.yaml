apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: pipeline-base
---
# Build context is demo/pipeline-base/ directory.
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: pipeline-base
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: pipeline-base:latest
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
