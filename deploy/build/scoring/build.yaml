apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: scoring
---
# Build context is scoring/ directory.
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: scoring
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: scoring:latest
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
