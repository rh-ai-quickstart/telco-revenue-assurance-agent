apiVersion: batch/v1
kind: Job
metadata:
  name: scoring
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: scoring
          image: image-registry.openshift-image-registry.svc:5000/telco-revenue-assurance-agent/scoring:latest
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DATABASE_URL
            - name: PREDICTOR_URL
              value: "http://predictor.telco-revenue-assurance-agent.svc:8080"
            - name: BATCH_SIZE
              value: "50"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
