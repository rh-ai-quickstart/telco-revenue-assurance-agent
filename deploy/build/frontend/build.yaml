apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: telco-frontend
---
# Build context is frontend/ so the Dockerfile's COPY . . captures only frontend files.
# Start with: oc start-build telco-frontend --from-dir=frontend/ --follow -n showcase
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: telco-frontend
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: telco-frontend:latest
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
