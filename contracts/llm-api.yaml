openapi: 3.1.0
info:
  title: OpenAI-compatible vLLM Chat Completions contract
  version: 1.0.0
  description: >-
    Internal model inference interface consumed by OGX. Model ID is explicit,
    streaming is disabled, and output is bounded. Deployment may point OGX to the
    on-cluster Llama 3.1 8B endpoint or the configured remote OpenAI-compatible
    fallback; the request contract stays the same.
servers:
  - url: /v1
    description: Namespace-local vLLM service or configured remote compatible endpoint
x-contract-guarantees:
  side_effects: Inference only; this API does not mutate application database state.
  errors: >-
    Invalid model ID, invalid request, rate limit, model unavailable, and unexpected
    inference errors use OpenAI-compatible error objects. OGX maps them to bounded
    typed failures.
  timeouts_retries: >-
    OGX uses a 90 second request deadline, permits at most one transient retry, and
    caps output at 2048 tokens. There is no unbounded generation or retry loop.
  ordering: No ordering guarantee across independent inference requests.
  versioning: OpenAI-compatible Chat Completions subset; breaking request/response changes require contract revision.
paths:
  /chat/completions:
    post:
      operationId: createChatCompletion
      summary: Generate a completion for the OGX agent
      description: >-
        OGX supplies the configured prompt, conversation context, and at most the
        four contract-approved MCP function definitions. Tool execution remains in
        OGX; this endpoint only returns text or a function call.
      x-side-effects: Inference only; no application rows are created or changed.
      x-error-codes: [INVALID_REQUEST, INVALID_MODEL_ID, AUTHENTICATION_OR_AUTHORIZATION, RATE_LIMITED, MODEL_UNAVAILABLE, INTERNAL_ERROR]
      x-timeouts-and-retries: >-
        OGX deadline is 90 seconds; at most one retry for transient 429/5xx or
        connection errors with 500 milliseconds exponential backoff capped at 1
        second. Output is capped at 2048 tokens.
      x-ordering: No ordering guarantee across requests; messages within a completion retain input order.
      x-versioning: OpenAI-compatible Chat Completions subset; breaking changes require contract revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            example:
              model: llama-3.1-8b-instruct
              messages:
                - role: system
                  content: Answer using the configured telco data tools.
                - role: user
                  content: Which customers have the highest churn class scores?
              tools: []
              tool_choice: auto
              stream: false
              max_tokens: 512
      responses:
        '200':
          description: Text completion or tool-call decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
              example:
                id: chatcmpl-01J8Z2N5M9K7
                object: chat.completion
                created: 1792581000
                model: llama-3.1-8b-instruct
                choices:
                  - index: 0
                    message:
                      role: assistant
                      content: I found 18 customers in churn class 1 for the latest completed run.
                      tool_calls: null
                    finish_reason: stop
                usage:
                  prompt_tokens: 328
                  completion_tokens: 16
                  total_tokens: 344
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/AuthorizationError'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ModelUnavailable'
components:
  schemas:
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages, stream, max_tokens]
      properties:
        model:
          type: string
          minLength: 1
          description: Explicit deployment-configured model identifier; never auto-select the first discovered model.
          example: llama-3.1-8b-instruct
        messages:
          type: array
          minItems: 1
          description: Ordered conversation context supplied by OGX.
          items:
            $ref: '#/components/schemas/ChatMessage'
        tools:
          type: [array, 'null']
          description: Optional OpenAI function definitions derived only from the four allowlisted MCP tools.
          items:
            $ref: '#/components/schemas/ToolDefinition'
        tool_choice:
          type: [string, 'null']
          enum: [auto, none, required, null]
          description: Tool selection behavior when the model can call a configured function.
          example: auto
        stream:
          type: boolean
          const: false
          description: Streaming is disabled; OGX uses a bounded request/reply call.
          example: false
        max_tokens:
          type: integer
          minimum: 1
          maximum: 2048
          description: Maximum generated tokens for this call.
          example: 512
        temperature:
          type: [number, 'null']
          minimum: 0
          maximum: 2
          description: Optional sampling temperature.
          example: 0.2
        top_p:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 1
          description: Optional nucleus sampling threshold.
          example: 0.9
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
          description: OpenAI Chat Completions message role.
          example: user
        content:
          type: [string, 'null']
          description: Text content; assistant tool-call messages may have null content.
          example: Which customers have the highest churn class scores?
        name:
          type: [string, 'null']
          description: Function name for a tool response, when role is tool.
          example: fetch_customer_data
        tool_call_id:
          type: [string, 'null']
          description: Tool-call identifier paired with a tool response.
          example: call_01J8Z2N5M9K8
        tool_calls:
          type: [array, 'null']
          description: Assistant tool calls; names are restricted to the four approved MCP tool names.
          items:
            $ref: '#/components/schemas/ToolCall'
    ToolDefinition:
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type:
          type: string
          const: function
          description: OpenAI function tool discriminator.
          example: function
        function:
          type: object
          additionalProperties: false
          required: [name, description, parameters]
          properties:
            name:
              type: string
              enum: [predict_churn, predict_fraud, predict_qoe, fetch_customer_data]
              description: One of the four tools registered in the OGX allowlist.
              example: predict_churn
            description:
              type: string
              description: Short instruction for when the model should call this domain tool.
              example: Predict churn class for a bounded list of customer IDs.
            parameters:
              type: object
              description: JSON Schema object generated from the matching MCP contract definition.
              additionalProperties: true
    ToolCall:
      type: object
      additionalProperties: false
      required: [id, type, function]
      properties:
        id:
          type: string
          description: Model-generated function call identifier.
          example: call_01J8Z2N5M9K8
        type:
          type: string
          const: function
          description: OpenAI function tool-call discriminator.
          example: function
        function:
          type: object
          additionalProperties: false
          required: [name, arguments]
          properties:
            name:
              type: string
              enum: [predict_churn, predict_fraud, predict_qoe, fetch_customer_data]
              description: Approved MCP tool name selected by the model.
              example: predict_churn
            arguments:
              type: string
              description: JSON-encoded arguments validated against the selected MCP JSON Schema before invocation.
              example: '{"customer_ids":["customer-00421"]}'
    ChatCompletionResponse:
      type: object
      additionalProperties: true
      required: [id, object, created, model, choices, usage]
      properties:
        id:
          type: string
          description: Unique completion identifier.
          example: chatcmpl-01J8Z2N5M9K7
        object:
          type: string
          const: chat.completion
          description: OpenAI Chat Completion object discriminator.
          example: chat.completion
        created:
          type: integer
          minimum: 0
          description: Unix timestamp when the completion was created.
          example: 1792581000
        model:
          type: string
          description: Model identifier used for inference.
          example: llama-3.1-8b-instruct
        choices:
          type: array
          minItems: 1
          description: Completion choices in the provider-returned order.
          items:
            $ref: '#/components/schemas/Choice'
        usage:
          $ref: '#/components/schemas/Usage'
    Choice:
      type: object
      additionalProperties: true
      required: [index, message, finish_reason]
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based choice index.
          example: 0
        message:
          $ref: '#/components/schemas/AssistantCompletionMessage'
        finish_reason:
          type: [string, 'null']
          enum: [stop, tool_calls, length, content_filter, null]
          description: Why generation stopped.
          example: stop
    AssistantCompletionMessage:
      type: object
      additionalProperties: true
      required: [role, content, tool_calls]
      properties:
        role:
          type: string
          const: assistant
          description: Completion message role.
          example: assistant
        content:
          type: [string, 'null']
          description: Assistant text, or null when the completion contains tool calls.
          example: I found 18 customers in churn class 1 for the latest completed run.
        tool_calls:
          type: [array, 'null']
          description: Optional function calls for OGX to validate and execute.
          items:
            $ref: '#/components/schemas/ToolCall'
    Usage:
      type: object
      additionalProperties: true
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
          description: Input tokens consumed by the request.
          example: 328
        completion_tokens:
          type: integer
          minimum: 0
          description: Tokens generated by the model.
          example: 16
        total_tokens:
          type: integer
          minimum: 0
          description: Total input plus output token count.
          example: 344
    OpenAIError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [message, type, param, code]
          properties:
            message:
              type: string
              description: Safe error message.
              example: The configured model is unavailable.
            type:
              type: string
              description: OpenAI-compatible error category.
              example: server_error
            param:
              type: [string, 'null']
              description: Invalid parameter, or null when not applicable.
              example: model
            code:
              type: [string, 'null']
              description: Stable code from contracts/errors.md, or null for an unspecified provider category.
              example: INVALID_MODEL_ID
  responses:
    InvalidRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAIError'
          example:
            error:
              message: max_tokens must be between 1 and 2048.
              type: invalid_request_error
              param: max_tokens
              code: INVALID_REQUEST
    AuthenticationError:
      description: Model endpoint authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAIError'
          example:
            error:
              message: Authentication is required.
              type: authentication_error
              param: null
              code: AUTHENTICATION_OR_AUTHORIZATION
    AuthorizationError:
      description: Caller is not authorized to use the model endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAIError'
          example:
            error:
              message: The caller is not authorized.
              type: permission_error
              param: null
              code: AUTHENTICATION_OR_AUTHORIZATION
    ModelNotFound:
      description: Configured model identifier is not available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAIError'
          example:
            error:
              message: The configured model identifier was not found.
              type: invalid_request_error
              param: model
              code: INVALID_MODEL_ID
    RateLimited:
      description: Model endpoint rejected the request due to rate limits.
      headers:
        Retry-After:
          description: Suggested delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAIError'
          example:
            error:
              message: The model is temporarily rate limited.
              type: rate_limit_error
              param: null
              code: RATE_LIMITED
    InternalError:
      description: Unexpected inference failure; provider internals remain server-side.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAIError'
          example:
            error:
              message: Inference could not be completed.
              type: server_error
              param: null
              code: INTERNAL_ERROR
    ModelUnavailable:
      description: Configured model is not ready or failed to respond.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAIError'
          example:
            error:
              message: The configured model is temporarily unavailable.
              type: server_error
              param: null
              code: MODEL_UNAVAILABLE
