apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.serviceName }}
  labels:
    {{- include "telco.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: oauth-proxy
      port: {{ .Values.frontend.oauthProxy.port }}
      targetPort: oauth-proxy
      protocol: TCP
  selector:
    {{- include "telco.componentSelector" (dict "root" . "component" "frontend") | nindent 4 }}
