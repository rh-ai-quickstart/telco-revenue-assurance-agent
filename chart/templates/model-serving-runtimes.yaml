{{- $root := . -}}
{{- range $entry := list
  (dict "name" $root.Values.modelServing.lightgbmRuntimeName "qoe" false)
  (dict "name" $root.Values.modelServing.onnxRuntimeName "qoe" false)
  (dict "name" $root.Values.modelServing.qoeRuntimeName "qoe" true)
-}}
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ $entry.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/runtime-version: 1.7.1
    opendatahub.io/template-display-name: MLServer ServingRuntime for KServe
    opendatahub.io/template-name: mlserver-runtime-template
    opendatahub.io/serving-runtime-scope: namespace
    openshift.io/display-name: {{ ternary "MLServer Runtime for Starlink QoE" "MLServer ServingRuntime for KServe" $entry.qoe | quote }}
    serving.kserve.io/server-type: mlserver
spec:
  annotations:
    monitoring.opendatahub.io/scrape: "true"
    opendatahub.io/kserve-runtime: mlserver
    prometheus.io/path: /metrics
    prometheus.io/port: "8082"
  containers:
    - name: kserve-container
      image: {{ $root.Values.modelServing.mlserverImage | quote }}
      env:
        - name: MLSERVER_MODEL_IMPLEMENTATION
          value: {{ "{{.Labels.modelClass}}" | quote }}
        - name: MLSERVER_HTTP_PORT
          value: "8080"
        - name: MLSERVER_MODELS_DIR
          value: /mnt/models
        {{- if $entry.qoe }}
        - name: MLSERVER_MODEL_MAX_BATCH_SIZE
          value: "32"
        - name: MLSERVER_MODEL_MAX_BATCH_TIME
          value: "0.5"
        {{- end }}
      ports:
        - containerPort: 8080
          protocol: TCP
      {{- if $entry.qoe }}
      resources:
        {{- toYaml (default $root.Values.modelServing.qoe.resources $root.Values.modelServing.resources) | nindent 8 }}
      {{- end }}
      livenessProbe:
        httpGet:
          path: {{ ternary "/v2/health/live" "/v2/models/{{.Name}}/ready" $entry.qoe | quote }}
          port: 8080
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      readinessProbe:
        httpGet:
          path: {{ "/v2/models/{{.Name}}/ready" | quote }}
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 3
      {{- if not $entry.qoe }}
      startupProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - |
              [ -n "$(ls -A /mnt/models 2>/dev/null)" ]
        failureThreshold: 1
        initialDelaySeconds: 1
        periodSeconds: 1
      {{- end }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        runAsNonRoot: true
  multiModel: false
  protocolVersions:
    - v2
  supportedModelFormats:
    {{- if not $entry.qoe }}
    - name: sklearn
      version: "0"
    - name: sklearn
      version: "1"
    - name: xgboost
      version: "1"
    - name: xgboost
      version: "2"
    - name: lightgbm
      version: "3"
    - name: lightgbm
      version: "4"
    {{- end }}
    - name: onnx
      version: "1"
      {{- if $entry.qoe }}
      autoSelect: true
      {{- end }}
{{ end }}
