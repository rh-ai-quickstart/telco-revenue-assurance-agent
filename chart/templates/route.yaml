apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "telco.fullname" . }}
  labels:
    {{- include "telco.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  annotations:
    haproxy.router.openshift.io/timeout: {{ .Values.frontend.route.timeout | quote }}
spec:
  {{- with .Values.frontend.route.host }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ .Values.frontend.serviceName }}
    weight: 100
  port:
    targetPort: oauth-proxy
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
