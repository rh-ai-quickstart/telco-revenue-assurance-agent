{{- $root := . -}}
{{- $serviceAccounts := list
  (dict "suffix" "oauth-proxy" "component" "frontend" "token" false)
  (dict "suffix" "api" "component" "api" "token" false)
  (dict "suffix" "prediction-tools" "component" "prediction-tools" "token" false)
  (dict "suffix" "data-fetch-tool" "component" "data-fetch-tool" "token" false)
  (dict "suffix" "data-generator" "component" "data-generator" "token" false)
  (dict "suffix" "migration" "component" "migration" "token" false)
  (dict "suffix" "db-role-init" "component" "db-role-init" "token" false)
  (dict "suffix" "db-grants" "component" "db-grants" "token" false)
-}}
{{- range $serviceAccount := $serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "telco.serviceAccount" (dict "root" $root "suffix" $serviceAccount.suffix) }}
  labels:
    {{- include "telco.componentLabels" (dict "root" $root "component" $serviceAccount.component) | nindent 4 }}
  {{- if eq $serviceAccount.suffix "oauth-proxy" }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: {{ printf "{\"kind\":\"OAuthRedirectReference\",\"apiVersion\":\"v1\",\"reference\":{\"kind\":\"Route\",\"name\":%q}}" (include "telco.fullname" $root) | quote }}
  {{- end }}
automountServiceAccountToken: {{ $serviceAccount.token }}
{{- end }}
{{- range $model := list
  (dict "name" $root.Values.modelServing.churn.serviceAccountName "component" "churn-model-serving")
  (dict "name" $root.Values.modelServing.fraud.serviceAccountName "component" "fraud-model-serving")
  (dict "name" $root.Values.modelServing.qoe.serviceAccountName "component" "qoe-model-serving")
}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $model.name }}
  labels:
    {{- include "telco.componentLabels" (dict "root" $root "component" $model.component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{/* The pinned dependencies use named accounts but do not create them. */}}
{{- range $component := list "pgvector" "ogx-ai" }}
{{- $subchart := index $root.Subcharts $component }}
{{- if and $subchart $subchart.Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include (printf "%s.serviceAccountName" $component) $subchart }}
  labels:
    {{- include "telco.componentLabels" (dict "root" $root "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
