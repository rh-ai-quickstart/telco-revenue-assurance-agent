{{- /* oauth-proxy loads its OAuth client secret at startup, so it needs a stable controller-issued SA token. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telco.oauthProxyTokenSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telco.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "telco.serviceAccount" (dict "root" . "suffix" "oauth-proxy") | quote }}
type: kubernetes.io/service-account-token
