apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.predictionTools.serviceName }}
  labels:
    {{- include "telco.componentLabels" (dict "root" . "component" "prediction-tools") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.predictionTools.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "telco.componentSelector" (dict "root" . "component" "prediction-tools") | nindent 4 }}
