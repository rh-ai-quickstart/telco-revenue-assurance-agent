apiVersion: v2
name: telco-revenue-assurance-agent
description: Revenue assurance insights with OGX, PostgreSQL, MCP tools, and KServe models
type: application
version: 0.1.0
appVersion: "0.1.0"
maintainers:
  - name: Red Hat AI Quickstarts
dependencies:
  - name: ogx-ai
    version: 0.8.6
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: ogx-ai.enabled
  - name: llm-service
    version: 0.1.0
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: llm-service.enabled
  - name: pgvector
    version: 0.1.0
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: pgvector.enabled
