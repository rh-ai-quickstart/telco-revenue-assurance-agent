      pinned_approach: A — Async SQLAlchemy sessions with explicit tool input filtering
      source_repo: https://github.com/rh-ai-quickstart/ai-virtual-agent
      source_ref: v1.1.17
      source_read: false
      match_reason: Async relational queries with stable typed outputs for MCP callers.
      adopt:
      - Create one async engine/session factory and inject a short-lived AsyncSession per call.
      - Expose typed customer and transaction data through stable aliases, not ORM internals.
      - Map requested fields through an allowlist and bind IDs as query parameters.
      - Use this service for prediction-tool feature reads and analyst-facing fetch_customer_data.
      reject:
      - Do not include multi-runner dispatch, MCP discovery, SQLite fallback, or SPA assets in this package.
      - Never accept arbitrary SQL or caller-supplied endpoint URLs.
      gotchas:
      - A missing DATABASE_URL must fail clearly rather than fall back to SQLite.
      - Unknown field aliases must be rejected before a query is issued.
      - Omitted, empty, and explicit field lists must return the same documented response shape.
      - AsyncSession is not shareable across concurrent tasks; verify separate sessions close on success and failure.
      - Verify every returned row belongs to the requested entity IDs and entity type.
    implementation_freedom:
    - Internal query decomposition and pagination strategy within response limits.
    constraints:
    - Expose one read-only fetch_customer_data tool with allowlisted entity names, field aliases, filters, and bounded
      result size.
    - Use bound SQL parameters and a read-only database role; reject arbitrary SQL, unrecognized JSON paths, and
      arbitrary URLs.
    - Return stable typed JSON suitable for both OGX and prediction-tools.
