        command: uv run pytest packages/prediction-tools/tests/test_mcp_contract.py -q
        exit_code: 0
    - id: prediction-tools-ac-2
      statement: When a KServe inference request is built, the payload and result mapping shall match each model
        contract and reject feature width/order mismatches.
      verify:
        command: uv run pytest packages/prediction-tools/tests/test_kserve_v2_contract.py -q
        expect: exit 0
      evidence_required: Tests cover churn tensor shape, fraud class mapping, QoE preprocessing, and mismatch rejection.
      status: passed
      evidence:
        report: .qs-factory/reports/model-integration-verification-2026-10-26.json
        command: uv run pytest packages/prediction-tools/tests/test_kserve_v2_contract.py -q
