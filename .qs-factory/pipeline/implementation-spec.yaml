    references:
    - kb_file: architectures/mcp-tool-integration.md
      pinned_approach: E — Co-deployed FastMCP service with startup tool registration and bounded result caching
      source_repo: https://github.com/rh-ai-quickstart/multi-agent-loan-origination
      source_ref: null
      source_read: true
      match_reason: MCP tool patterns for three stable prediction functions and a cache; source ref was unavailable.
      adopt:
      - Expose predict_churn, predict_fraud, and predict_qoe with typed domain results.
      - Hide database fetching, preprocessing, KServe V2 payloads, and model URLs inside the service.
      - Use a bounded cache keyed by prediction type, subject, model version, and feature snapshot; coalesce identical
        in-flight calls.
      - Cache successful predictions only and return structured unavailable errors on serving failure.
      reject:
      - Do not treat cached tool definitions as inference-result caching.
      - Do not silently remove a model tool when its service is unavailable.
      - Do not return JSON-encoded strings or change public tool schemas when serving changes.
      gotchas:
      - Tool-definition caching does not prevent repeated inference; verify concurrent identical calls make one
        request.
      - Customer-only cache keys can return stale data; verify model-version or feature-snapshot changes invalidate
        the entry.
      - MCP restart can stale cached definitions; verify all three names resolve on reconnect.
      - ONNX class order or numeric output mapping can invert labels; verify fraud class ordering and positive fraud
        mapping with fixed fixtures.
    implementation_freedom:
    - Cache storage implementation within configured TTL/capacity.
    - Internal package layout beyond the named public files.
    constraints:
    - Expose only predict_churn, predict_fraud, and predict_qoe; all calls use bounded customer or transaction identifier
      batches.
    - Call fetch_customer_data over MCP for model features; do not query PostgreSQL or call cluster APIs directly.
    - Validate feature order, width, categorical mappings, ONNX class order, and QoE preprocessing sidecars before
      inference.
    - Cache only successful typed results by tool, subject, model version, and feature snapshot.
    - No arbitrary model URLs, SQL, filesystem paths, or Kubernetes operations in tool arguments.
    acceptance_criteria:
    - id: prediction-tools-ac-1
      statement: When a client connects to the prediction MCP service, it shall expose exactly the three approved
        prediction tools with typed outputs.
      verify:
        command: uv run pytest packages/prediction-tools/tests/test_mcp_contract.py -q
        expect: exit 0
      evidence_required: The test report confirms the exact tool names and response schemas.
      status: passed
      evidence:
