    files_to_modify: []
    env_vars:
    - name: DATABASE_URL
      description: Seed-writer async PostgreSQL DSN from an OpenShift Secret.
      example: postgresql+asyncpg://<secret-ref>
    - name: GENERATOR_SEED
      description: Seed for repeatable synthetic joins and regional assignment.
      example: '42'
    - name: REGIONAL_QOE_CHURN_COUPLING
      description: Tunable strength of the synthetic regional relationship.
      example: '0.4'
    - name: INGEST_BATCH_SIZE
      description: Bounded database insert/upsert batch size.
      example: '1000'
    references:
    - kb_file: deployment/helm-seed-job-dual-curl-python-rag-ingestion.md
      pinned_approach: A — Finite Python seed Job, adapted for idempotent relational dataset generation
      source_repo: https://github.com/rh-ai-quickstart/llm-cpu-serving
      source_ref: 3c82804eb51d7525a5ee470e2dd0a169f6ae55d7
      source_read: true
      match_reason: Seed Job lifecycle patterns for the Hugging Face dataset generator.
      adopt:
      - Run the generator as a finite worker from the versioned Python image after a bounded database readiness
        check.
      - Pass dataset identifiers, snapshot/revision, seed, batch size, and coupling settings as configuration; load
        data in the worker.
      - Use stable source keys and upserts so interrupted/repeated runs do not duplicate rows.
      reject:
      - Do not add AnythingLLM setup, vector-store creation, HTML extraction, or Kubernetes API RBAC.
      - Do not mount a script from a ConfigMap into the LLM image.
      - Do not use unbounded readiness loops or zero retry policy without a defined resume strategy.
      gotchas:
      - A DB readiness loop can hang; verify wait/retry is bounded and eventual readiness succeeds.
      - Filename-based skips do not prevent duplicate relational rows; run the same snapshot twice and verify stable
        keys/counts.
    implementation_freedom:
    - Internal dataset iteration and database chunking within bounded memory.
    constraints:
    - Load the full named public dataset snapshots and preserve every source row.
    - Retain all churn billing cycles and calculate customer dollar_weight as mean TotalBillAmount across all cycles.
    - Use the latest BillingCycleStart for churn scoring without deleting earlier cycles.
    - Assign RAFM transaction rows many-to-one to customers; preserve original features and labels, and keep Plan_Type
      consistent per customer.
    - Preserve all QoE source samples and use empirical locations/classes; generate regional season/weather and
      tunable coupling without editing trained-on labels.
    - Use stable source keys and idempotent upserts; no schedule or implicit app-start scoring.
    acceptance_criteria:
    - id: data-generator-ac-1
      statement: When a deterministic source snapshot is loaded, the worker shall preserve row grain, customer dollar
        weight, joins, and configured regional coupling.
