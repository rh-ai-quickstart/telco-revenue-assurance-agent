      - Set response limits in model/server config if per-request max_tokens is unsupported by the selected Responses
        API.
    - kb_file: architectures/agent-orchestration.md
      pinned_approach: D — Declarative OGX agent configuration with persistent state
      source_repo: https://github.com/rh-ai-quickstart/it-self-service-agent
      source_ref: v0.0.14
      source_read: true
      match_reason: Agent configuration and session-resume patterns.
      adopt:
      - Keep model ID, prompt, session identity, and allowed tools in declarative configuration.
      - Persist session state in PostgreSQL and resume it by stable session ID.
      - Bound retries and define a fallback response for empty or failed model responses.
      reject:
      - Do not add LangGraph, Knative events, specialist agents, intent routing, or NeMo Guardrails.
      gotchas:
      - In-memory stores lose state on restart; verify state survives recreating the session handler.
      - Unbounded empty/error retries can hang; verify retry count and delay cap.
    - kb_file: architectures/mcp-tool-integration.md
      pinned_approach: D — OGX Responses API native MCP
      source_repo: https://github.com/rh-ai-quickstart/it-self-service-agent
      source_ref: v0.0.14
      source_read: true
      match_reason: Native MCP registration and allowlisting for OGX.
      adopt:
      - Configure MCP servers as native Responses API entries using stable service URLs.
      - Allowlist exactly predict_churn, predict_fraud, predict_qoe, and fetch_customer_data.
      - Keep model and database details behind MCP tools.
      reject:
      - Do not use LangChain MultiServerMCPClient or unrestricted tool discovery.
      - Do not copy source-specific ServiceNow identity forwarding.
      - Do not allow unreviewed write-capable tools.
      gotchas:
      - An MCP server can advertise extra tools; verify OGX still exposes exactly the four approved tools.
      - MCP sessions reconnect after server restarts under OGX control; verify a failed call is bounded and a subsequent
