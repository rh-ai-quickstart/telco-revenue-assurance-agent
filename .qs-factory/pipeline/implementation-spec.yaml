spec_version: 1
quickstart_name: 'Telco Revenue Assurance Agent: Quality, Churn & Fraud Insights'
slug: telco-revenue-assurance-agent
skill: rh-qs-implement
created_at: '2026-10-20T21:24:48Z'
inputs:
- path: .qs-factory/designs/architecture-spec.yaml
  content_hash: sha256:8525961ea096aafbe9f01beee6bb608fdeccf024f7b5e26fea2eed0d7b728148
- path: .qs-factory/designs/architecture-diagram.mmd
  content_hash: sha256:768e680a873197ac633fe35309f28361ebfdf48401c1c2bc2b979fd0d72fc9fb
scope:
  in_scope:
  - 'Five application packages: packages/ui, packages/api, packages/prediction-tools, packages/data-fetch-tool,
    and packages/data-generator.'
  - Frozen REST, MCP, database, and KServe V2 contracts under contracts/.
  - Unit and contract tests for the application packages.
  - The Helm surface for ai-architecture-charts dependencies, application workloads, migration/seed Jobs, and KServe
    InferenceServices.
  - Resume model integration by copying the supplied pipelines and serving snapshots byte-for-byte, preserving their
    tested behavior in Helm, and adapting prediction response handling to their outputs.
  out_of_scope:
  - .github/workflows/** — owned by rh-qs-test-suite.
  - README.md and docs/** — owned by rh-qs-document.
  - Any oc or kubectl invocation — forbidden by rh-qs-secure; use Helm/Makefile targets only.
  - Cluster deployment and verification — owned by rh-qs-deploy and rh-qs-verify-deploy.
  - compose.yml or local runtime — technology_stack.local_runtime says not required.
  - Model retraining and storing model binaries/credentials in Git — outside this implementation.
  open_questions:
  - id: oq-database-schema
    question: Approve the proposed normalized v1 relational schema and its table grain.
    blocking: false
    resolved_as: 'User approved the provisional six-table v1 domain proposal on 2026-10-21: customers; billing_cycles
      (one row per churn source cycle); transactions (one row per RAFM source row); qoe_samples (one row per Starlink
      source sample); scoring_runs; predictions, with typed query/model fields and lossless JSONB source features.
      User separately approved app.chat_requests on 2026-10-21 for durable API chat idempotency, storing session/request
      IDs, a message hash, and the completed public response. Its rejected state preserves request-ID binding after
      an explicit upstream rejection so changed content still conflicts. Final source identifiers, column types,
      key rules, QoE cardinality, nullability, and currency semantics remain deferred until the source database
      schema is ready.'
  - id: oq-model-artifact-inputs
    question: Where will the KServe model artifacts and QoE preprocessing sidecars be stored?
    blocking: false
    resolved_as: Treat external S3-compatible artifact URIs, per-model KServe bearer-token Secret references, and
      preprocessing sidecars as deployment inputs; actual credentials and binaries remain outside Git.
  - id: oq-source-serving-checkout
    question: How should the supplied serving checkout be treated while it remains separate on disk?
    blocking: false
    resolved_as: 'User directed that it is one future repo; use its serving manifests and preprocessing pipelines
      as the source of truth and bring equivalent definitions into this quickstart during implementation. Reviewed
      source ref: 3037c340c5a4a27ae53f95b9146562c12c985c79.'
conventions:
  python: Use async SQLAlchemy 2 sessions and typed public functions. Settings come from packages/common; never
    read os.environ directly. Use versioned migrations.
  typescript: No any. Generate API types from contracts/openapi.yaml. Route data fetching through TanStack Query
    hooks and typed service functions.
  errors: Use shared typed error envelopes. MCP and KServe failures are mapped to bounded structured errors; never
    return raw SQL or provider internals.
  config: Every configurable value is declared in the work unit env_vars or chart values. Model features and tensor
    shapes are validated before inference.
  secrets: Secret values never enter source or values.yaml. Use OpenShift Secret references and least-privilege
    per-workload identities.
  forbidden_strings:
  - ai-quickstart-template
  - my-quickstart
  - CONTRIBUTOR_NAME
  - localhost
  - TODO
contracts:
- id: frontend-api
  kind: openapi
  path: contracts/openapi.yaml
  content_hash: sha256:da4d5cf1ed1b3b670fdf9917a0138ebd3ffde723b1c843bb143233b3edb23dfa
  owner: backend
  consumers:
  - frontend
  guarantees:
    side_effects: GET metrics and status reads are side-effect free. POST scoring-run creation uses an idempotency
      key; POST chat creates or continues only the specified session and persists request hashes and completed responses
      for replay.
    errors: 400 VALIDATION_ERROR, 401/403 AUTHENTICATION_OR_AUTHORIZATION, 404 NOT_FOUND, 409 RUN_ALREADY_ACTIVE
      or IDEMPOTENCY_CONFLICT, 503 UPSTREAM_UNAVAILABLE; all use the shared error envelope.
    timeouts_retries: Scoring creation returns 202 promptly; chat and metrics use bounded upstream timeouts. Retry
      503 at most twice with exponential backoff; never retry 4xx.
    ordering: Scoring runs are independently identified and their persisted status/progress is monotonic. Chat requests
      are serialized per session; matching request IDs and message hashes replay the stored response, while changed
      content returns IDEMPOTENCY_CONFLICT. GET responses have no ordering guarantee.
    versioning: Path prefix /api/v1; breaking changes require a new prefix.
  verification:
    provider: uv run pytest packages/api/tests/test_openapi_contract.py -q
    consumer: pnpm --filter ui run generate:types && pnpm --filter ui run typecheck
  change_policy: owner-only; a consumer needing a change returns to the main agent
- id: ogx-responses
  kind: openapi
  path: contracts/ogx-responses.yaml
  content_hash: sha256:b0b23eeede26b786cd10cdb7469490421bf0376a142bdfa2bbc4ef4672de629f
  owner: agent-orchestration
  consumers:
  - backend
  guarantees:
    side_effects: A request may create or advance the specified durable conversation session and invoke only allowlisted
      read/prediction tools.
    errors: Invalid request, authentication failure, tool timeout, and upstream model error map to typed API errors;
      no silent tool omission.
    timeouts_retries: Backend sets a bounded request deadline; OGX retries model errors only within a configured
      cap and returns a structured failure on exhaustion.
    ordering: Messages are serialized per session; repeated request IDs are deduplicated where supported.
    versioning: OpenAI-compatible Responses API schema pinned to the configured OGX chart; breaking changes require
      contract revision.
  verification:
    provider: helm lint chart/
    consumer: uv run pytest packages/api/tests/test_ogx_client.py -q
  change_policy: owner-only; a consumer needing a change returns to the main agent
- id: llm-api
  kind: openapi
  path: contracts/llm-api.yaml
  content_hash: sha256:5c5faefc80adcfd73e9d0efed9cdf06d2e812cbef4dfc3933e6918f5c5f21bde
  owner: llm-serving
  consumers:
  - agent-orchestration
  guarantees:
    side_effects: Inference only; no application database mutations.
    errors: Model unavailable, invalid model ID, and invalid request are surfaced to OGX as typed upstream failures.
    timeouts_retries: OGX applies a bounded request timeout and bounded retry policy; no unbounded generation or
      retry loop.
    ordering: No ordering guarantee across independent inference requests.
    versioning: OpenAI-compatible inference API; configured model ID is explicit and changes are deployment values.
  verification:
    provider: helm lint chart/
    consumer: helm lint chart/
  change_policy: owner-only; a consumer needing a change returns to the main agent
- id: prediction-mcp
  kind: json-schema
  path: contracts/prediction-mcp.json
  content_hash: sha256:a21a219f22076b669b0c90a5854c3b3dd308eb7575eba7f14aec770333b68d22
  owner: prediction-tools
  consumers:
  - backend
  - agent-orchestration
  guarantees:
    side_effects: Prediction calls are read/inference operations and persist no application rows by themselves;
      optional cache writes are bounded and disposable.
    errors: INVALID_INPUT, SUBJECT_NOT_FOUND, MODEL_UNAVAILABLE, FEATURE_SCHEMA_MISMATCH, and UPSTREAM_TIMEOUT are
      typed MCP errors.
    timeouts_retries: Maximum identifier batch is configured and bounded; clients use a deadline and retry only
      transient upstream errors once or twice.
    ordering: Batch results preserve input subject order and include subject IDs; duplicate IDs are deduplicated
      within a request.
    versioning: MCP tool names and JSON Schemas are versioned with the contract; breaking changes require a new
      schema version.
  verification:
    provider: uv run pytest packages/prediction-tools/tests/test_mcp_contract.py -q
    consumer: helm lint chart/ && uv run pytest packages/api/tests/test_mcp_clients.py -q
  change_policy: owner-only; a consumer needing a change returns to the main agent
- id: data-fetch-mcp
  kind: json-schema
  path: contracts/data-fetch-mcp.json
  content_hash: sha256:629c9c6618bb34d5e940f9660b8a3f44c03f955f61c5ac27869c1de049bdbff0
  owner: data-fetch-tool
  consumers:
  - backend
  - prediction-tools
  - agent-orchestration
  guarantees:
    side_effects: Read-only; no database mutation.
    errors: INVALID_ENTITY, INVALID_FIELD, INVALID_FILTER, RESULT_LIMIT_EXCEEDED, and DATABASE_UNAVAILABLE are typed
      MCP errors.
    timeouts_retries: IDs and result rows are bounded; callers set a deadline and may retry one transient database-unavailable
      error.
    ordering: Results use deterministic ordering by stable source key unless the caller specifies an approved sort
      key.
    versioning: MCP tool name and schema are versioned; adding a field is compatible, renaming/removing requires
      a new schema version.
  verification:
    provider: uv run pytest packages/data-fetch-tool/tests/test_mcp_contract.py -q
    consumer: uv run pytest packages/prediction-tools/tests/test_data_fetch_client.py packages/api/tests/test_mcp_clients.py
      -q && helm lint chart/
  change_policy: owner-only; a consumer needing a change returns to the main agent
- id: database-connection
  kind: typed-interface
  path: contracts/database-connection.yaml
  content_hash: sha256:5f1dec685d18b4d760c6753b279618e92e2909ab9b8aad158cb81a59e78cd3d8
  owner: database
  consumers:
  - backend
  - agent-orchestration
  - data-fetch-tool
  - data-generator
  guarantees:
    side_effects: Connection only; distinct database roles scope write access for API, OGX state, data fetch, and
      seeding.
    errors: Connection, readiness, and authentication failures fail closed; no empty SQLite fallback.
    timeouts_retries: Clients bound connection pool, connection timeout, and readiness wait; migrations and seeding
      retry only within a fixed cap.
    ordering: Migrations complete before seeded data or API traffic that requires the new schema.
    versioning: Service DNS, database names, Secret key names, and role capabilities are versioned with chart values.
  verification:
    provider: helm lint chart/ && helm template chart/ >/dev/null
    consumer: uv run pytest packages/api/tests/test_database_configuration.py packages/data-fetch-tool/tests/test_database_config.py
      packages/data-generator/tests/test_generator_database_config.py -q && helm lint chart/
  change_policy: owner-only; a consumer needing a change returns to the main agent
- id: database-schema
  kind: sql-ddl
  path: contracts/schema.sql
  content_hash: sha256:d7bae521eb4f09eca4f701bb6be1ba18572109ce257463cac4efd8bc97a275be
  owner: backend
  consumers:
  - data-fetch-tool
  - data-generator
  guarantees:
    side_effects: DDL is applied only by the versioned migration job; never create or alter schema at request time.
    errors: Constraint violations fail the transaction with a typed application error; raw database errors are not
      returned to callers.
    timeouts_retries: Migration lock and statement timeouts are bounded; data-generator uses idempotent upserts
      and bounded retry.
    ordering: Migration revisions apply in order; the migration head must match contracts/schema.sql before the
      generator starts.
    versioning: Alembic revision chain; destructive changes require an expand/migrate/contract sequence.
  verification:
    provider: uv run pytest packages/api/tests/test_schema_parity.py -q
    consumer: uv run pytest packages/data-fetch-tool/tests/test_schema_compat.py packages/data-generator/tests/test_generator_schema_compat.py
      -q
  change_policy: owner-only; a consumer needing a change returns to the main agent
- id: churn-inference
  kind: json-schema
  path: contracts/churn-inference.json
  content_hash: sha256:9ca36b97f1e992cb7a19b543c7151569e6f36aa75b21ac998fe11a2356061757
  owner: churn-model-serving
  consumers:
  - prediction-tools
  guarantees:
    side_effects: Stateless inference; no application database mutation.
    errors: Invalid tensor, model not ready, invalid model name, and storage errors map to KServe V2 error responses.
    timeouts_retries: Prediction client uses a bounded timeout; retry only transient readiness/5xx errors within
      a fixed cap.
    ordering: One output row per input row, preserving input order.
    versioning: KServe V2 with model-settings feature width and an ordered feature manifest versioned with the artifact.
  verification:
    provider: helm lint chart/
    consumer: uv run pytest packages/prediction-tools/tests/test_kserve_v2_contract.py -q
  change_policy: owner-only; a consumer needing a change returns to the main agent
- id: fraud-inference
  kind: json-schema
  path: contracts/fraud-inference.json
  content_hash: sha256:005df9bed21ee5eeca6a7119860ac6042b8cee59646f3d4f40cde7e944bc7fcb
  owner: fraud-model-serving
  consumers:
  - prediction-tools
  guarantees:
    side_effects: Stateless inference; no application database mutation.
    errors: Invalid tensor, model not ready, invalid model name, and storage errors map to KServe V2 error responses.
    timeouts_retries: Prediction client uses a bounded timeout; retry only transient readiness/5xx errors within
      a fixed cap.
    ordering: One class output per input transaction, preserving input order.
    versioning: KServe V2 ONNX tensor schema and class ordering are pinned with artifact metadata/manifest.
  verification:
    provider: helm lint chart/
    consumer: uv run pytest packages/prediction-tools/tests/test_kserve_v2_contract.py -q
  change_policy: owner-only; a consumer needing a change returns to the main agent
- id: qoe-inference
  kind: json-schema
  path: contracts/qoe-inference.json
  content_hash: sha256:c3bbe6fca5c2c54ddc2118efcdf1c27a00cb833134201d80c3b02b2cc313ab51
  owner: qoe-model-serving
  consumers:
  - prediction-tools
  guarantees:
    side_effects: Stateless inference; no application database mutation.
    errors: Invalid tensor, model not ready, missing preprocessing sidecar, and storage errors are surfaced as typed
      errors.
    timeouts_retries: Prediction client uses a bounded timeout; retry only transient readiness/5xx errors within
      a fixed cap.
    ordering: One scalar score per input customer/location, preserving input order.
    versioning: KServe V2 ONNX schema with ordered eight-feature preprocessing manifest versioned with artifacts.
  verification:
    provider: helm lint chart/
    consumer: uv run pytest packages/prediction-tools/tests/test_kserve_v2_contract.py -q
  change_policy: owner-only; a consumer needing a change returns to the main agent
build_order:
  units:
  - database
  - data-fetch-tool
  - churn-model-serving
  - fraud-model-serving
  - qoe-model-serving
  - llm-serving
  - data-generator
  - prediction-tools
  - agent-orchestration
  - backend
  - frontend
  cycle_breaks: []
components:
  frontend:
    work_unit_id: frontend
    delivery: application
    type: ui
    package_path: packages/ui
    role: Revenue assurance analyst dashboard with on-demand metrics and chat.
    depends_on:
    - backend
    owns_contracts: []
    consumes_contracts:
    - frontend-api
    files_to_create:
    - path: packages/ui/index.html
      purpose: Vite HTML shell that mounts the analyst dashboard.
    - path: packages/ui/package.json
      purpose: Vite/React package and scripts for the dashboard.
    - path: packages/ui/tsconfig.json
      purpose: Strict TypeScript configuration used by the workspace typecheck gate.
    - path: packages/ui/src/main.tsx
      purpose: React entry point and router setup.
    - path: packages/ui/src/routes/dashboard.tsx
      purpose: Dashboard route with run selection and aggregated metrics.
    - path: packages/ui/src/components/ChatPanel.tsx
      purpose: Typed analyst chat UI with pending, completed, and error states.
    - path: packages/ui/src/services/api.ts
      purpose: REST service functions generated from the OpenAPI contract.
    - path: packages/ui/src/hooks/use-scoring-run.ts
      purpose: TanStack Query hooks keyed by scoring-run ID.
    - path: packages/ui/src/api/types.ts
      purpose: Generated API types from contracts/openapi.yaml; never hand-edited.
    - path: packages/ui/src/routes/dashboard.test.tsx
      purpose: Dashboard and chat state tests.
    files_to_modify: []
    env_vars:
    - name: VITE_API_BASE_URL
      description: Same-origin API base path.
      example: /api/v1
    references:
    - kb_file: components/react-frontend.md
      pinned_approach: B — shadcn/ui + Tailwind dashboard with TanStack data layers; adapt chat to the approved
        HTTP API
      source_repo: https://github.com/rh-ai-quickstart/multi-agent-loan-origination
      source_ref: 1e50e51c334c1b6ed854d81a3f28fd324792f481
      source_read: true
      match_reason: React UI patterns for a dashboard and analyst chat.
      adopt:
      - Use React 19 and TypeScript with TanStack Router and TanStack Query.
      - Keep API calls in service functions and hooks; validate responses with Zod and key metric queries by scoring-run
        ID.
      - Keep chat messages in typed pending, complete, and error states; the selected v1 interface is request/reply
        over the REST API.
      - Run the static UI as a separate image with writable nginx runtime directories for OpenShift arbitrary UIDs.
      reject:
      - Mortgage-specific roles, screens, and schemas do not fit the single analyst dashboard.
      - Keycloak login, password-grant flows, demo identities, and JWTs in query strings are outside the approved
        auth design.
      - WebSocket transport is not required by the architecture; no WebSocket/nginx upgrade path is added.
      - Do not suppress unresolved Vite imports globally.
      gotchas:
      - A clean pnpm install can expose undeclared or hoisted imports; verify the frozen-lockfile build and declared
        dependencies with the UI build/typecheck.
      - If nginx environment substitution is used, dollar-prefixed variables in config can be mangled; validate
        rendered nginx configuration in the image build.
      - OpenShift arbitrary UIDs can fail if nginx runtime directories are read-only; image verification must run
        with a random non-root UID.
    implementation_freedom:
    - Component decomposition and styling within the selected design system.
    - Dashboard visualization details that preserve PRD metrics.
    constraints:
    - Use only the analyst workflow; no mortgage roles or Keycloak login.
    - Consume generated OpenAPI types; do not hand-write request or response interfaces.
    - Use the REST chat contract; do not add WebSocket auth or transport without a spec change.
    acceptance_criteria:
    - id: frontend-ac-1
      statement: When API types are generated, the committed client types shall match contracts/openapi.yaml.
      verify:
        command: pnpm --filter ui run generate:types && git diff --exit-code packages/ui/src/api/types.ts
        expect: exit 0
      evidence_required: The generation command succeeds and git diff is empty.
      status: passed
      evidence:
        report: .qs-factory/reports/model-integration-verification-2026-10-26.json
        command: pnpm --filter ui run generate:types && git diff --exit-code packages/ui/src/api/types.ts
        exit_code: 0
    - id: frontend-ac-2
      statement: When UI tests run, the dashboard shall render the selected scoring run metrics and chat pending/error
        states.
      verify:
        command: pnpm --filter ui exec vitest run
        expect: exit 0
      evidence_required: Vitest summary shows the dashboard and chat tests passing.
      status: passed
      evidence:
        report: .qs-factory/reports/model-integration-verification-2026-10-26.json
        command: pnpm --filter ui exec vitest run
        exit_code: 0
  backend:
    work_unit_id: backend
    delivery: application
    type: backend
    package_path: packages/api
    role: FastAPI API for metrics, on-demand scoring runs, chat sessions, and persistence.
    depends_on:
    - agent-orchestration
    - database
    - prediction-tools
    - data-fetch-tool
    owns_contracts:
    - frontend-api
    - database-schema
    consumes_contracts:
    - ogx-responses
    - prediction-mcp
    - data-fetch-mcp
    - database-connection
    files_to_create:
    - path: packages/api/pyproject.toml
      purpose: uv workspace package and API dependencies.
    - path: packages/api/src/api/__init__.py
      purpose: Package marker for workspace type checking and imports.
    - path: packages/api/src/api/db/__init__.py
      purpose: Database package marker.
    - path: packages/api/src/api/routes/__init__.py
      purpose: Route package marker.
    - path: packages/api/src/api/services/__init__.py
      purpose: Service package marker.
    - path: packages/api/src/api/main.py
      purpose: FastAPI app factory, lifespan, and router registration.
    - path: packages/api/src/api/routes/scoring.py
      purpose: Scoring-run create, status, and results routes from OpenAPI.
    - path: packages/api/src/api/routes/metrics.py
      purpose: Dashboard metric query routes.
    - path: packages/api/src/api/routes/chat.py
      purpose: Chat request/reply endpoint and session routes.
    - path: packages/api/src/api/services/scoring.py
      purpose: Persisted, bounded-batch scoring coordinator with resumable progress.
    - path: packages/api/src/api/services/chat.py
      purpose: Session-serialized OGX chat service with durable request replay and conflict handling.
    - path: packages/api/src/api/services/ogx_client.py
      purpose: OGX Responses API client adapter.
    - path: packages/api/src/api/services/mcp_clients.py
      purpose: Prediction and data-fetch MCP clients with deadlines.
    - path: packages/api/src/api/db/models.py
      purpose: SQLAlchemy models matching contracts/schema.sql.
    - path: packages/api/src/api/db/session.py
      purpose: Lifespan-managed async engine and session factory.
    - path: packages/api/alembic.ini
      purpose: Package-local Alembic CLI configuration for the versioned migration job.
    - path: packages/api/alembic/env.py
      purpose: Alembic configuration for versioned schema migrations.
    - path: packages/api/alembic/versions/0001_initial_schema.py
      purpose: Initial migration for the approved v1 schema.
    - path: packages/api/tests/test_openapi_contract.py
      purpose: Provider contract checks for the public REST API.
    - path: packages/api/tests/test_scoring.py
      purpose: Scoring idempotency, batching, and resume tests.
    - path: packages/api/tests/test_schema_parity.py
      purpose: Migration/schema contract parity checks.
    - path: packages/api/tests/test_ogx_client.py
      purpose: OGX Responses API consumer contract tests.
    - path: packages/api/tests/test_mcp_clients.py
      purpose: MCP client consumer contract tests.
    - path: packages/api/tests/test_database_configuration.py
      purpose: Database URL and role configuration tests.
    - path: packages/api/tests/test_chat_idempotency.py
      purpose: Durable chat response replay, conflict, in-progress, and safe-retry tests.
    files_to_modify: []
    env_vars:
    - name: DATABASE_URL
      description: Async PostgreSQL DSN sourced from an OpenShift Secret.
      example: postgresql+asyncpg://<secret-ref>
    - name: OGX_BASE_URL
      description: Namespace-local OGX Responses API endpoint.
      example: http://ogx-ai:8321
    - name: OGX_MODEL_ID
      description: Explicit model identifier sent to OGX Responses requests.
      example: llama-3.1-8b-instruct
    - name: PREDICTION_MCP_URL
      description: Namespace-local prediction MCP endpoint.
      example: http://prediction-tools:8000/mcp
    - name: DATA_FETCH_MCP_URL
      description: Namespace-local data-fetch MCP endpoint.
      example: http://data-fetch-tool:8000/mcp
    - name: SCORING_BATCH_SIZE
      description: Maximum identifiers sent to one MCP prediction call.
      example: '100'
    references:
    - kb_file: components/fastapi-backend.md
      pinned_approach: A — Multi-Runner Chat Dispatch; apply the FastAPI service and session patterns with OGX as
        the sole orchestrator
      source_repo: https://github.com/rh-ai-quickstart/ai-virtual-agent
      source_ref: null
      source_read: false
      match_reason: FastAPI patterns for agent sessions, database access, and tool calls; source repo was not fetched
        in this digest.
      adopt:
      - Create the async engine in FastAPI lifespan and inject a short-lived SQLAlchemy AsyncSession per request.
      - Separate route handlers from services coordinating chat, scoring runs, MCP calls, and persistence.
      - Use Alembic migrations and explicit async/sync DSN normalization.
      reject:
      - Do not dispatch among LlamaStack, LangGraph, and CrewAI; OGX is the single orchestrator.
      - Do not use SQLite or in-memory conversation persistence.
      - Do not schedule scoring or run it on startup.
      gotchas:
      - Async DSN replacement can double-prefix asyncpg and Alembic needs a sync URL; test both conversions.
      - In-memory state is lost on restart; verify persisted session resume from PostgreSQL.
      - Import-time endpoint assertions can mask configuration errors; verify missing settings fail with a clear
        startup error.
    - kb_file: architectures/agent-orchestration.md
      pinned_approach: A — Multi-Runner Chat Dispatch; use the stable service boundary, not framework selection
      source_repo: https://github.com/rh-ai-quickstart/ai-virtual-agent
      source_ref: null
      source_read: false
      match_reason: Agent orchestration patterns for the API-to-OGX execution boundary; source repo was not fetched
        in this digest.
      adopt:
      - Route session requests through one backend orchestration service with typed request and response contracts.
      - Keep tool calls and results framework-independent at the backend boundary.
      - Persist sessions in PostgreSQL so a session can resume after a process restart.
      reject:
      - Do not add selectable LangGraph/CrewAI/LlamaStack runners.
      - Do not use an in-memory checkpointer for durable state.
      - Do not adopt Dask/deep-research job offloading; scoring remains analyst-triggered.
      gotchas:
      - Framework-specific tool events can leak through a normalized adapter; test mapping of a tool call, result,
        and error.
