human_review:
  resumed_scope: 'User requested integration of the three supplied model deployments on 2026-10-26, explicitly preserving
    the source pipelines unchanged. This completes the already approved source-serving-checkout decision. Existing
    package layout, component DAG, namespace/auth boundaries, and external artifact ownership remain approved.

    '
  summary: Build a React analyst dashboard and async FastAPI API around three supplied KServe models. Two separate
    FastMCP services expose the three predictions and read-only customer-data access; OGX consumes exactly four
    native MCP tools. PostgreSQL persists source rows, on-demand scoring runs, prediction results, OGX sessions,
    and API chat-idempotency records. Helm deploys OGX, vLLM, PostgreSQL, the app workloads, and KServe resources;
    existing external S3 artifacts remain deployment inputs.
  delivery_triage:
    application:
    - frontend
    - backend
    - prediction-tools
    - data-fetch-tool
    - data-generator
    chart:
    - agent-orchestration
    - llm-serving
    - database
    rhoai:
    - churn-model-serving
    - fraud-model-serving
    - qoe-model-serving
  package_layout:
  - packages/ui
  - packages/api
  - packages/prediction-tools
  - packages/data-fetch-tool
  - packages/data-generator
  - packages/common and packages/configs from foundation-builder
  dag_order: database → data-fetch-tool and model/LLM serving → data-generator → prediction-tools → agent-orchestration
    → backend → frontend. No dependency cycles or cycle breaks.
  decisions_requiring_approval:
  - decision: 'Approve the proposed six-table schema: customers, billing_cycles, transactions, qoe_samples, scoring_runs,
      predictions. This expands the PRD’s conceptual two-table model to preserve every source row and persist scoring
      results.'
    rationale: Churn needs all billing cycles for mean dollar weight and latest-cycle scoring; QoE source samples,
      RAFM transactions, run state, and predictions also need durable grain.
    reversible: true
  - decision: Add app.chat_requests for durable API chat idempotency, keyed by (session_id, request_id), preserving
      request-ID binding through explicit upstream rejections and storing the original completed response payload.
    rationale: The REST contract promises exact replay for identical request content and IDEMPOTENCY_CONFLICT when
      a request ID is reused with changed content; database persistence makes that behavior survive API restarts.
    reversible: true
  - decision: Use separate FastMCP services for prediction-tools and data-fetch-tool, with streamable HTTP and the
      four-tool OGX allowlist.
    rationale: This follows the user direction to use MCP services and keeps database/model details behind stable
      tool contracts.
    reversible: true
  - decision: 'Use the supplied serving checkout at commit 3037c340c5a4a27ae53f95b9146562c12c985c79 as model-serving
      source: LightGBM v4/KServe V2 for churn, ONNX/MLServer for fraud and QoE, with QoE preprocessing sidecars.'
    rationale: The provided manifests and pipelines define the current runtime and preprocessing contracts; source
      checkout separation will be removed as requested.
    reversible: true
  - decision: Use external S3-compatible artifact URIs and existing Secret references; this chart does not deploy
      object storage.
    rationale: The supplied KServe manifests load existing model artifacts and QoE preprocessing sidecars from S3-compatible
      storage.
    reversible: true
  - decision: 'Approve package layout and the 10 contracts: OpenAPI, OGX Responses API, LLM API, prediction MCP,
      data-fetch MCP, PostgreSQL connection, SQL schema, and three model inference contracts.'
    rationale: The layout follows the five application components; each internal boundary has a single provider
      and a consumer verification command.
    reversible: true
  - decision: Pin the KB approaches listed in the component references; retain null source refs where a KB example
      repo was not fetched.
    rationale: This prevents component implementers from choosing incompatible patterns. The source checkout’s separate
      Git commit is pinned independently.
    reversible: true
  - decision: Keep the supplied KServe models authenticated and internal to the release namespace rather than preserving
      their exposed external routes.
    rationale: Only prediction-tools needs inference access; namespace-local endpoints and network policies reduce
      the exposed surface while preserving KServe auth.
    reversible: true
  deferred:
  - Actual S3 bucket paths and Secret names are deployment values; credentials and model binaries remain outside
    Git.
  - Exact model feature manifests/class metadata must match the deployed artifacts; validate width/order and class
    mapping before inference.
  - CI workflows — rh-qs-test-suite.
  - README and catalog documentation — rh-qs-document after verified deployment.
  - Cluster installation and live service verification — rh-qs-deploy and rh-qs-verify-deploy.
  contract_inventory:
  - 'frontend-api: backend → frontend'
  - 'ogx-responses: agent-orchestration → backend'
  - 'llm-api: llm-serving → agent-orchestration'
  - 'prediction-mcp: prediction-tools → backend and agent-orchestration'
  - 'data-fetch-mcp: data-fetch-tool → backend, prediction-tools, and agent-orchestration'
  - 'database-connection: database → backend, agent-orchestration, data-fetch-tool, and data-generator'
  - 'database-schema: backend → data-fetch-tool and data-generator'
  - 'churn-inference, fraud-inference, qoe-inference: each model-serving component → prediction-tools'
