      description: Agent-based AI app with tool use, multi-framework runners, and orchestrated workflows on RHOAI
      summary: 'Archetype for deploying AI agents on RHOAI that reason, invoke tools via MCP protocol, and orchestrate multi-step workflows -- ten approaches (A-J) cover conversational agent platforms, event-driven pipelines, framework-less MCP-native agents, CloudEvent-driven multi-microservice systems, operator-managed agents with full observability, regulated-industry multi-persona platforms with compliance controls, MCP-server-centric observability agents where the application IS the tool server, two-phase deterministic-then-agentic pipelines with REST-based HTTP tool discovery, NVIDIA AI-Q Blueprint multi-agent multi-depth research systems with declarative YAML workflows and intent-routed shallow/deep research, and domain-specific NL-to-SQL pipeline agents with LangGraph state graphs translating natural language alert rules into executable SQL queries for transaction monitoring. Choose over rag-chatbot when AI must take actions beyond retrieval and over model-serving-app when an orchestration layer wraps the served model; pick A (ai-virtual-agent) for general-purpose interactive tool use with pluggable runners (LlamaStack/LangGraph/CrewAI) and configurable guardrails, B (ansible-log-analysis) for Grafana-alert-triggered LangGraph pipelines with nested sub-agents (main graph -> get_more_context_agent -> loki_agent) and Loki MCP querying, C (data-governance-co-pilot) for switchable MCPDirectProvider vs LlamaStackProvider orchestration via COPILOT_PROVIDER_MODE with Pydantic-validated ALLOWED_TOOLS fail-closed allowlist and Nemotron/OpenAI dual format auto-detection with think-tag streaming separation, D (it-self-service-agent) for enterprise IT self-service with 3 CloudEvent/Knative/Kafka FastAPI microservices and YAML-configurable LangGraph state machines with router-specialist topology and multi-channel integration (Slack/email/Zammad), E (lls-observability) for observability-first deployment via operator-managed LlamaStackDistribution CR with standalone MCP servers (weather/HR/OpenShift ops with read-only RBAC), Llama Guard 3-1B safety, comprehensive OTel sidecar injection for vLLM traces+metrics and LlamaStack traces with TempoStack+Grafana+UWM PodMonitors, optional MaaS integration (maas.enabled via LiteLLM), and zero custom backend code, F (multi-agent-loan-origination) for regulated-industry with 5 persona-specific LangGraph agents, Keycloak RBAC per-tool allowed_roles and per-role DataScope (PII masking/own-data-only), NeMo Guardrails fail-closed input/output shield nodes (/v1/guardrail/checks API with NemoGuard 8B), SHA-256 hash-chained audit trails with PostgreSQL advisory locks, HMDA data isolation enforced by lint-hmda-isolation CI, tier-boosted pgvector compliance KB (federal 1.5x > agency 1.2x > internal 1.0x), human-in-the-loop two-phase decisions (PROPOSE then CONFIRM), vision document extraction (pymupdf + LLM fallback), FastMCP risk server (Streamable HTTP), A2A/Kagenti with SPIRE mTLS, structured compliance checks (ECOA/ATR-QM/TRID) gating underwriting, and three-tier evaluation (MLflow GenAI + KFP + EvalHub), G (openshift-ai-observability-summarizer) for platform observability intelligence with 40+ FastMCP tools querying Prometheus/Tempo/Korrel8r/vLLM, multi-provider chatbot factory (OpenAI/Anthropic/Google/Meta) with MCPServerAdapter for in-process tool calling, OpenShift Console Plugin, Helm Operator (AIObservabilitySummarizer CR) lifecycle, alerting CronJob (Alertmanager + LlamaStack + Slack), report generation (HTML/PDF/Markdown), and curated metrics catalog with dynamic Prometheus validation, H (portfolio-manager-agent) for two-phase deterministic-then-agentic pipeline with Flask orchestrator implementing REST HTTP tool discovery protocol (GET /tools for schema, POST /tools/<name> for execution), 3 specialized Flask tool agents (portfolio/VaR/guidelines), OpenAI SDK function calling agentic loop (no framework), KServe-served scikit-learn MLP classifier via MLServer for guideline sentence classification, NeMo Guardrails via TrustyAI CR with graceful degradation, frozen compliance constraints persisting from deterministic pipeline to agentic chat, automatic VaR retry loop (up to 10 attempts), and optional Knative serverless tool agents, I (rh-research) for NVIDIA AI-Q Blueprint multi-agent research with NeMo Agent Toolkit (NAT) declarative YAML workflow configuration (agents/tools/LLMs/routing), LangGraph-based orchestrator with intent classification (meta vs research) and depth routing (shallow vs deep with escalation), LangChain Deep Agents for multi-phase deep research (planning/parallel source research/report writing with citation verification), data source registry with per-request UI toggles (Tavily/Google Scholar/LlamaIndex-ChromaDB/Polymarket), async deep research jobs via Dask workers with SSE streaming and PostgreSQL-backed persistence, API-only NVIDIA NIM model serving (no on-cluster inference), tokenomics profiling for cost/latency analysis, built-in evaluation harnesses (FreshQA/DeepResearch Bench/DeepSearch QA), and Next.js frontend with NVIDIA Foundations React Core, J (spending-transaction-monitor) for domain-specific NL-to-SQL pipeline with three LangGraph state graphs (parse_alert_graph/generate_alert_graph/validate_rule_graph) translating natural language alert rules to SQL via LLM-driven prompt-based generation (no tool calling), LlamaStack for inference, conditional routing (saved SQL reuse via timestamp substitution vs full LLM parse), dual recommendation engine (LLM-based AlertRecommendationService for new users with demographic prompts, ML KNN collaborative filtering MLAlertRecommendationService for existing users with KServe-served sklearn model and automatic fallback), sentence-transformers embeddings (all-MiniLM-L6-v2) with pgvector for rule similarity checking (not RAG), Kubeflow pipeline for KNN model training and KServe InferenceService deployment, React+Vite+TypeScript frontend, Keycloak 26.0.7 auth, and email/SMS alert delivery via smtp4dev. Critical patterns: A stacks vLLM/LlamaStack with function calling behind FastAPI managing agent lifecycle and SSE streaming with React/PatternFly and pgvector; B uses dual OpenAI-compatible endpoints with FAISS RAG, Gradio, DeepEval annotation, and Arize Phoenix + Grafana + Alloy observability; C deploys KServe+vLLM (Nemotron Nano 9B or Qwen3-14B AWQ) with auto-converted MCP-to-OpenAI tools, governance policy injection via REST API, and SvelteKit+Vega-Lite; D deploys shared-models/shared-clients libraries with LlamaStack+vLLM (Llama 3 70B) via ai-architecture-charts, PostgreSQL-backed LangGraph checkpoints with session locking, MCP servers for ServiceNow/Zammad, and Langfuse+MLflow+OTel+ClickHouse observability; E deploys custom OTel-instrumented vLLM image supporting GPU and Xeon CPU via conditional Helm values, 3 standalone MCP Helm charts, inline Milvus+sentence-transformers RAG, and Streamlit Playground+Jupyter notebooks; F deploys model-server-agnostic (any OpenAI-compatible via LLM_BASE_URL) with tiered model routing (llm/vision/embedding via config/models.yaml), MLflow autolog with Kubernetes auth, Prometheus custom metrics (LLM tokens/latency/routing/tool calls), and React (Radix UI+TanStack Router+Tailwind CSS); G deploys umbrella aiobs-stack chart via Helm Operator spanning infrastructure (MinIO/TempoStack/LokiStack/OTel Collector/Korrel8r) and application (MCP server/console plugin/alerting/RAG) across multiple namespaces with optional RAG stack via ai-architecture-charts subcharts; H deploys Flask orchestrator with REST tool discovery connecting to 3 Flask tool agents on ports 7001-7003, KServe InferenceService with MLServer scikit-learn for MLP guideline classifier (RawDeployment mode with S3/MinIO model storage via Job upload), per-request LLM config (llmUrl/model/apiKey from frontend), and React+Vite+TypeScript two-tab frontend; I deploys NAT Python application with FastAPI front-end plugin, LangGraph orchestrator (ChatResearcherAgent) and shallow researcher (ShallowResearcherAgent with max_llm_turns: 10), LangChain Deep Agents deep researcher (DeepAgentsRuntime with DEFAULT_MAX_RESEARCH_CONCURRENCY = 6), Dask workers for async jobs with NAT JobStore and SSE EventStore, PostgreSQL for job metadata and LangGraph checkpoints, ChromaDB for LlamaIndex vector storage, modular data source plugins (Tavily/Serper/Exa/DuckDuckGo/Polymarket/knowledge layer), JWT authentication middleware with OIDC, and Next.js frontend with WebSocket reconnection; J deploys LangGraph state graphs with LlamaStack LLM inference (LlamaStackClient.chat.completions.create), YAML-templated prompts for NL-to-SQL generation, conditional graph routing (should_use_saved_sql for timestamp substitution fast path vs full LLM parse), dual recommendation services (AlertRecommendationService with demographic prompts + MLAlertRecommendationService with KServe-served KNN model and automatic fallback), sentence-transformers embeddings with pgvector for rule similarity detection, Kubeflow pipeline for model training and KServe deployment, React+Vite+TypeScript frontend, Keycloak 26.0.7 auth, Nginx reverse proxy, and email/SMS delivery via smtp4dev. Common gotchas: E requires 5 OLM operators with strict phased deployment ordering (operators -> observability -> AI services -> MCP servers), D requires Knative Eventing + Kafka Broker (Strimzi-managed) infrastructure overhead with session locking (acquire_agent_session_lock/release_agent_session_lock) for concurrent handling plus mock services for development, F requires fail-closed guardrails for regulated domains with PostgreSQL advisory lock serialization for hash-chain consistency and structured compliance check gating (FAIL blocks underwriting approval), G requires cluster-admin for console plugin and cluster-wide observability RBAC (ClusterRoleBinding for Prometheus/Thanos/Tempo/Loki) plus SSE timeout Route annotation (haproxy.router.openshift.io/timeout: 300s via reencrypt TLS), and C requires MCP session reconnection with exponential backoff for pod restarts and dual tool-calling format handling (Nemotron custom TOOLCALL tags vs standard OpenAI) with auto-detection from model name, H requires KServe InferenceService with MLServer for scikit-learn MLP in RawDeployment mode with S3 model upload Job and gracefully degrades guardrails if GUARDRAILS_URL is unset or unreachable, I requires NVIDIA NIM API access (integrate.api.nvidia.com/v1) with per-model pricing and Dask worker infrastructure (DASK_NWORKERS/DASK_NTHREADS) for async deep research jobs with PostgreSQL-backed JobStore persistence and configurable job expiry (expiry_seconds: 86400), and J requires LlamaStack inference endpoint with YAML-templated prompt engineering for reliable SQL generation and KServe InferenceService with MLServer sklearn runtime for KNN model in RawDeployment mode with Kubeflow pipeline for automated model training and deployment plus dual recommendation fallback logic (ML model unavailable triggers LLM-based fallback); simple prompt-response or document-only QA should use model-serving-app or rag-chatbot instead.'
