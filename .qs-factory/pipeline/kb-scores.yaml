    - path: components/llamastack.md
      name: llamastack
      description: LlamaStack distribution server providing inference, agents, safety, tool runtime, and vector I/O APIs
      summary: 'LlamaStack provides a unified AI orchestration server exposing inference, agents, safety, tool runtime, vector I/O, and files APIs between application backends and model providers (Ollama, vLLM, or any OpenAI-compatible endpoint), configured via llamastack-run.yaml (RUN_CONFIG_PATH) declaring providers per API. Six approaches: A (compose, Responses API with StreamAggregator SSE, pluggable LlamaStack/LangGraph/CrewAI runner, MCP toolgroup resolution, input shields via client.safety.run_shield()) for local dev; B (OpenShift AI operator LlamaStackDistribution CRD v0.3.5, alpha.agents API, remote::vllm, Makefile-driven model.name/url/apiKey) for operator-managed production; C (ai-architecture-charts subchart v0.8.6, dual-client LlamaStackClient + OpenAI SDK, global.models shared across subcharts, tool_runtime.rag_tool with 600s timeout, rawDeploymentMode, managedByOperator toggle for Helm-vs-operator dual deployment, model ID candidate resolution for 0.6.0+ provider-prefixed format, fileProcessors pypdf, _TOOL_ALLOWLIST for Llama context window management) for RAG with optional F5 guardrails proxy; D (subchart v0.8.5, Responses API, PostgreSQL kv_postgres/sql_postgres, centralized client factory, post-init scaler Job, MCP + file_search tools) for multi-replica production; E (standalone chart, Red Hat ET image, OpenTelemetry sidecar with otel_trace/otel_metric sinks, inline::milvus, dual vLLM providers, network policies, ArgoCD sync-wave) for observability; F (remote::openai, app bypasses LlamaStack SDK using OpenAI SDK directly, disabled by default) for optional safety proxy with inline::llama-guard. Critical patterns: AsyncLlamaStackClient with K8s SA token + X-Forwarded-User/Email headers for RBAC (A), provider-prefixed model vllm-inference/<model> with VLLM_TLS_VERIFY=false (B), URL normalization stripping legacy /v1/openai/v1 and vector_dbs fallback to vector_stores on 404 with nudge-then-direct-tool-execution fallback for unreliable tool calling (C), LLAMASTACK_SERVICE_HOST avoiding LLAMASTACK_PORT tcp:// format with db_path: null preventing SQLite fallback and pgvector max_connections=200 (D), TELEMETRY_SINKS=''console, sqlite, otel_trace, otel_metric'' with configmap checksum annotation for pod restart and OTEL_PYTHON_DISABLED_INSTRUMENTATIONS=sqlite3 suppressing trace noise (E), and conditional safety API via llamastack.safety.enabled with InferenceService authTokenSecret override (F). Common gotchas: container runs as root (user 0:0) with 90s healthcheck start_period, SDK attribute names changed between 0.3.x and 0.6.1 (identifier to id, api_model_type to model_type) requiring _get_model_type/_get_model_id helpers, SQLite storage is dev-only, regex-based tool retry parsing (Tool ''(\w+)'' not found) is fragile, Nemotron models incompatible with llama_stack mode (use mcp_direct), MILVUS_DB_PATH relative path resolves outside PVC mount at /.llama, VLLM_API_TOKEN hardcoded to ''fake'', llama-stack-client version pinning differs between frontend (0.6.0) and tests (>=0.2.9,<0.2.13), compose sets platform: linux/amd64 causing ARM emulation overhead, and post-init scaler requires bitnami/kubectl mirroring in air-gapped environments.'
