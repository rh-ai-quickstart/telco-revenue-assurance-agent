  architectures:
    - path: architectures/agent-orchestration.md
      name: agent-orchestration
      description: Agent orchestration patterns from multi-runner dispatch to LangGraph DAGs to NAT+DeepAgents multi-tier research
      summary: 'Defines eight pluggable agent orchestration patterns (A-H) for RHOAI quickstarts: A (multi-runner ChatService dispatch normalizing SSE via BaseRunner.stream() across LlamaStack/LangGraph/CrewAI with graph_config declarative DAG mode), B (hierarchical LangGraph DAG with Command-based routing and structured-output schemas for event-driven batch log analysis with embedding+clustering deduplication), C (dual-provider factory via COPILOT_PROVIDER_MODE selecting MCP-Direct backend loop with hard-coded allowlist+Pydantic tool validation and Nemotron TOOLCALL tag parsing vs delegated Llama Stack), D (YAML state machines with 5 generic state types generating LangGraph StateGraphs, multi-agent routing via CloudEvent/Knative, LlamaStack Responses API with native MCP), E (multi-persona LangGraph agents with YAML per-tool RBAC via tool_auth graph node, NeMo Guardrails as input/output shield nodes, mtime-based hot-reloading, A2A via Kagenti), F (structured-output RouteDecision router classifying context vs SQL path with nested ReAct SQL agent for multimodal CV+database analytics), G (HTTP tool discovery via GET /tools + POST /tools/<name>, two-phase deterministic pipeline then agentic chat with PHASE2_TOOLS filtering and mutable context auto-VaR recalculation), H (NAT+DeepAgents multi-tier research with LangGraph orchestrator for intent-driven shallow/deep depth routing, role-based LLMProvider mapping 11 semantic roles to different models, concurrent researcher workers, SourceRegistryMiddleware citation verification, optional Dask async offloading). Select by user interaction model (chat vs batch vs event-driven), framework flexibility needs (single vs pluggable), tool security requirements (none to hard-coded allowlist to RBAC graph nodes), and multi-agent routing complexity (none to CloudEvent microservices to depth-routed subagents). Critical integration patterns include BaseRunner.stream() SSE contract for framework-agnostic streaming, YAML state type definitions (waiting/llm_processor/intent_classifier/llm_validator/terminal) driving dynamic LangGraph construction, tool_auth node checking per-tool allowed_roles before execution, and deterministic thread IDs (user:{user_id}:agent:{agent_name}) enabling cross-session conversation resumption with AsyncPostgresSaver checkpointing. Common gotchas: LangGraph/CrewAI runners require lazy imports inside _get_runner() to avoid missing-package errors; in-memory MemorySaver and conversation_store dict lose all state on pod restart -- use AsyncPostgresSaver for production; Llama Stack agent instructions are immutable so policy updates require full agent recreation invalidating all sessions; tool validation (allowlist+Pydantic) applies only in MCP-Direct mode in Approach C leaving the Llama Stack path without equivalent security; and CrewAI''s _StreamDeduplicator is necessary because CrewAI streams raw ReAct tokens (Thought/Action/Action Input) that are noise to end users.'
      match_reason: "Covers agents and tool-calling patterns matching 2 requested AI patterns, with LlamaStack orchestration frameworks matching the tech stack"
    - path: architectures/model-serving-gateway.md
      name: model-serving-gateway
      description: Model inference behind KServe with vLLM or MLServer in Standard or RawDeployment mode, consumed by downstream services
      summary: 'Deploys model inference behind KServe using three approaches: (A) vLLM CPU in Standard/Knative mode with OCI modelcar for TinyLlama as a multi-consumer gateway (AnythingLLM via LocalAI provider, Llama Stack via remote::vllm, RHOAI Playground) with hermes tool-call parser and max-model-len 2048; (B) vLLM GPU/Xeon in RawDeployment mode with OTel tracing for Llama 3.2 3B, dual-device Helm chart switching image/resources via `index .Values.image $device`, llama3_json parser with Jinja2 chat template ConfigMap, and max-model-len 65000; (C) MLServer sklearn runtime in RawDeployment for traditional ML joblib models on MinIO S3 via KServe V2 inference API with BYTES data type and fallback to in-process joblib when INFERENCE_URL is empty. Choose A for shared multi-consumer gateway when Service Mesh + Serverless operators are available; B for GPU-accelerated models needing OTel observability or RawDeployment simplicity without Knative stack; C for non-LLM scikit-learn classification/regression with lightweight CPU inference. Critical config: VLLM_CPU_KVCACHE_SPACE at InferenceService level overrides ServingRuntime value; Standard mode requires `networking.knative.dev/visibility: cluster-local` (no external Route) with `security.opendatahub.io/enable-auth: false` disabling endpoint auth; RawDeployment creates direct Service with OpenShift Route; Approach C model-upload Job uses init container + MinIO mc CLI with 30 retries at 2s intervals for cold start. Gotchas: GPU vLLM image bundles OTel but Xeon requires custom BuildConfig image; LD_PRELOAD default jemalloc improves pyarrow but switching to libomp improves vLLM at the cost of breaking pyarrow; max-model-len varies drastically (A=2048, B=65000) with proportional memory impact; V2 inference response returns probability pairs requiring extraction at index `i*2+1`.'
      match_reason: "Directly addresses deployment question 3 (model artifact format compatibility for KServe/MLServer) with vLLM and MLServer sklearn serving patterns, matching KServe and vLLM from tech stack"
    - path: architectures/mcp-tool-integration.md
      name: mcp-tool-integration
      description: MCP tool integration from multi-framework registration to transport layer to persistent validated sessions
      summary: 'Integrates MCP tool servers into agent systems via seven approaches: A (ai-virtual-agent) provides multi-framework registration via LlamaStack toolgroups API with Kubernetes discovery from ToolHive MCPServer CRDs and labeled Services, four runtime paths (LlamaStack Responses API, LangGraph ReAct via `langchain-mcp-adapters`, GraphEngine direct JSON-RPC with `_MCP_SESSIONS` cache and `_filter_args_to_schema`, CrewAI local wrappers via `_TOOL_CLASS_BY_NAME`); B (ansible-log-analysis) hides MCP inside LangChain `@tool` functions as transport for a single Loki server with per-query `MCPClient` lifecycle, tool result caching, and closure-bound tool creation; C (data-governance-co-pilot) maintains a persistent MCP session with pg-airman-mcp via MCP SDK `streamablehttp_client`+`ClientSession` with exponential backoff, `ALLOWED_TOOLS` Pydantic validation, auto-reconnection, and dual consumption (MCP-Direct vs Llama Stack); D (it-self-service-agent) uses LlamaStack Responses API native MCP with per-request `AUTHORITATIVE_USER_ID`/`traceparent`/`SERVICE_NOW_TOKEN` headers, per-agent YAML config, and `@trace_mcp_tool()` OpenTelemetry tracing; E (multi-agent-loan-origination) co-deploys FastMCP with pure-computation risk tools cached at startup as LangChain StructuredTool instances with optional secondary server graceful degradation; F (multimodal-compliance-monitor) wraps crystaldba/postgres-mcp `execute_sql` with contextvars-based `current_app_config_id` SQL scoping guard; G (openshift-ai-observability-summarizer) makes the MCP server the entire application with tools registered via `self.mcp.tool()`, dual consumption by frontend JSON-RPC (stateless HTTP) and internal chatbot via `MCPServerAdapter` ToolExecutor pattern. Choose A for extensible multi-server platforms needing dynamic Kubernetes discovery, UI management, and multi-framework support; B for single fixed-server integrations where MCP is invisible to the LLM with per-query session lifecycle; C for security-first single-server scenarios needing persistent sessions with auto-reconnection, tool validation allowlist, and dual-mode consumption (MCP-Direct appends `/mcp`, Llama Stack appends `/sse`); D for multi-agent IT automation needing per-user authorization headers, OpenTelemetry tracing propagation, per-agent YAML MCP config, and LlamaStack-delegated MCP session lifecycle; E for pure-computation MCP servers co-deployed with the agent where tools are cached at startup with no per-request session overhead and optional secondary servers with graceful fallback; F for per-tenant SQL scoping of read-only database queries where application-level contextvars guard enforces row filtering; G when the MCP server IS the application consumed both externally via stateless HTTP JSON-RPC and internally via ToolExecutor dependency injection with multi-provider chatbot support. MCP servers register with `mcp_endpoint={"uri": url}` and provider `model-context-protocol` (A); Kubernetes discovery uses `app.kubernetes.io/component=mcp-server` label with transport from `mcp.transport` label (default streamable-http appending `/mcp`); GraphEngine refreshes `_MCP_SESSIONS` on 400/404 containing "session" and `_filter_args_to_schema` drops extra arguments to prevent -32602; B wraps calls in `execute_loki_query()` creating new `MCPClient` per invocation with `Mcp-Session-Id` headers and `MAX_LOGS_PER_QUERY` (5000) cap; C uses 5-retry exponential backoff (1-10s) with `_reconnect_mcp()` on 404/"Session terminated"/ClosedResourceError and `check_mcp_server_tools()` warning-only at startup; D injects headers into Responses API tool definitions with per-state `uses_mcp_tools` toggling and FastMCP servers use `mcp_common.headers.header_first` for auth extraction; E initializes `MultiServerMCPClient` in FastAPI lifespan caching as module-level `_tools` with `/health` via `@mcp.custom_route`; F sets `current_app_config_id` contextvar per Flask request checking SQL against `_SCOPED_TABLES` set returning error strings for ReAct retry; G mounts MCP app last via `app.mount("/", mcp_app)` with `_enforce_no_routes_after_mount()` and `MCPServerAdapter` runs async tools in separate threads with `asyncio.new_event_loop()`. CrewAI MCP is not native, requiring entries in both `_TOOL_CLASS_BY_NAME` and `_SERVER_TOOL_NAME_HINTS`; B creates new `MCPClient`/`httpx.AsyncClient` per query with no connection pooling; C''s Pydantic validation only runs in MCP-Direct mode (Llama Stack bypasses it, creating prompt injection risk) and pg-airman-mcp replicas require Service-level session affinity; D''s LlamaStack manages MCP sessions internally giving agents no control over session reuse/timeouts/reconnection, `AUTHORITATIVE_USER_ID` format varies between ServiceNow (`re.sub(r"-\d+$")`) and Zammad (`parse_email_and_ticket_id`), and `dummy_parameter` exists because MCP validation requires at least one parameter; E''s cached tools become stale on MCP server restart with no reconnection logic and `get_predictive_tool()` searches by hardcoded name "check_loan_approval"; F''s SQL guard uses string matching (`any(t in sql_lower for t in _SCOPED_TABLES)`) that can false-positive on table names in string literals and `DATABASE_URI` gives postgres-mcp full read access (scoping is application-level only); G''s global `_server_instance` creates module-level coupling and tools loaded at graph init via `asyncio.run()` will fail if MCP server is not ready.'
      match_reason: "Covers tool-calling integration patterns potentially useful for tool caching implementation (deployment question 1), with Python/FastAPI/LlamaStack matching 3 tech stack components"
