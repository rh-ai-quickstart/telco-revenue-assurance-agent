    - path: components/react-frontend.md
      name: react-frontend
      description: React frontend patterns for AI Quickstarts -- PatternFly/SSE, shadcn+Tailwind/WebSocket, CRA+serve video, or Vite+nginx pipeline UI
      summary: 'Provides four React frontend patterns for AI Quickstarts -- Approach A (React 18 + PatternFly 6 + @patternfly/chatbot) for chatbot-first UIs with SSE streaming via requestAnimationFrame batching, TanStack Router/Query/Form, SimpleContentItem discriminated union with GraphNodeContentItem/ProgressStepper agent visualization, OAuth redirect, and single-container deployment baked into FastAPI; Approach B (React 19 + shadcn/ui + Tailwind CSS 4 + Radix) for multi-persona enterprise apps with WebSocket JSON protocol streaming, Keycloak OIDC with PKCE and dev-mode role headers, Zod-validated layered API (Component->Hook->TanStack Query->Service->Schema), atomic design with Storybook 8, pnpm monorepo, and separate nginx container with window.__RUNTIME_CONFIG__ injection; Approach C (React 17 + CRA JavaScript + serve) for MJPEG video monitoring with SSE cross-tab config sync, setInterval polling with stale detection guards, feedNonce cache-buster for stream switching, ConfigMap-mounted window.__ENV__ with protocol auto-upgrade, natural language alert rules with CRUD, and Helm-deployed separate container; Approach D (React 19 + Vite 6 + vanilla CSS) for multi-step pipeline orchestration with accordion-based navigation (no router), REST POST chat unlocked after pipeline completion with bidirectional context feedback via updateOutputsFromContext, retry loop (MAX_PIPELINE_ATTEMPTS=10), dual runtime config (build ARGs + window.__RUNTIME_CONFIG__), UBI9/nginx-120 container with 300s proxy_read_timeout, and minimal 4 prod dependencies with MSW testing. Choose A for chatbot apps needing PatternFly design system, SSE rAF-batched streaming, TanStack Form admin panels, any OAuth provider, and single-container deploy -- choose B for multi-role domain-rich UIs needing Keycloak OIDC, role-based persona routing (ROLE_HOME mapping), WebSocket chat sidebar, Zod schema validation, and two-container nginx+API deploy -- choose C for video/multimodal monitoring needing MJPEG feeds via <img> tags, polling-based detection, SSE config sync, plain JavaScript frontend, and Helm-deployed serve+ConfigMap container -- choose D for pipeline-driven sequential workflows needing accordion UI, REST chat with bidirectional context feedback, no auth, UBI9/nginx-120 reverse proxy, and minimal dependencies. Critical patterns: A and B use TanStack Router file-based routing with code-splitting; A models chat content as SimpleContentItem discriminated union (output_text, reasoning, tool_call, graph_node, input_image) with LlamaStack isToolExecutionType()/isStructuralItemType() type guards; B injects Keycloak/company config at container start via nginx location returning JavaScript snippet with envsubst-substituted values; C uses ConfigMap env.js with fallback chain (runtime -> REACT_APP_API_URL -> location.origin/api) and sends current detection description as context with each chat message; D passes full PipelineContext into every chat call and applies returned context updates back to pipeline outputs panel, with postJson using AbortController-based timeouts (300s default, 180s for email generation). Gotchas: Vite requires watch.usePolling:true in containers; A needs NODE_OPTIONS=--max-old-space-size=512 for builds, strips reasoning items on [DONE], raises chunkSizeWarningLimit to 2000, requires flushPendingUpdates() with confirmation modal on session switch during streaming, and excludes fetchSessionsData from useEffect deps to prevent infinite loops; B requires WebSocket upgrade map in nginx.conf (not conf.d/ where envsubst mangles $ variables), passes JWT as WebSocket query parameter (MVP trade-off), needs OpenShift arbitrary UID chmod/chgrp on nginx dirs, downgrades Vite 7 UNRESOLVED_IMPORT errors for pnpm hoisted deps, and uses deprecated ROPC grant for demo convenience; C requires --openssl-legacy-provider for Node 18+, must avoid <img> remounting to prevent MJPEG connection stacking, disables ESLint during Docker build, and polls inference readiness every 200ms until OVMS model processes first frame; D requires matching /api rewrite in both Vite dev proxy and nginx production config, locks chat until pipeline completes with hardcoded fallback message, uses useRef concurrency guard against double pipeline execution, and hardcodes default pipeline values including CloudFront-hosted PDF URL.'
