helm:
  chart_path: chart/
  dependencies:
  - name: ogx-ai
    chart: https://rh-ai-quickstart.github.io/ai-architecture-charts
    version: 0.8.6
    condition: ogx-ai.enabled
  - name: llm-service
    chart: https://rh-ai-quickstart.github.io/ai-architecture-charts
    version: 0.1.0
    condition: llm-service.enabled
  - name: pgvector
    chart: https://rh-ai-quickstart.github.io/ai-architecture-charts
    version: 0.1.0
    condition: pgvector.enabled
  inference_services:
  - churn-prediction
  - fraud-prediction
  - starlink-qoe
  containerfiles:
  - package: api
    path: packages/api/Containerfile
  - package: data-fetch-tool
    path: packages/data-fetch-tool/Containerfile
  - package: data-generator
    path: packages/data-generator/Containerfile
  - package: prediction-tools
    path: packages/prediction-tools/Containerfile
  - package: ui
    path: packages/ui/Containerfile
  jobs:
  - name: database-role-init
    template: chart/templates/database-role-init-job.yaml
  - name: database-grants
    template: chart/templates/database-grants-job.yaml
  - name: migration
    template: chart/templates/migration-job.yaml
  - name: data-generator
    template: chart/templates/data-generator-job.yaml
  runtime_inputs:
    model_artifacts:
    - model: churn
      uri_value: modelServing.churn.uri
      storage_secret_value: modelServing.churn.storageSecretName
      default_uri_is_placeholder: false
      default_storage_mode: existing-data-connection
      storage_path_value: modelServing.churn.storagePath
      default_storage_path: models/churn/1
      explicit_uri_override_supported: true
    - model: fraud
      uri_value: modelServing.fraud.uri
      storage_secret_value: modelServing.fraud.storageSecretName
      default_uri_is_placeholder: false
      default_storage_mode: existing-data-connection
      storage_path_value: modelServing.fraud.storagePath
      default_storage_path: models/
      explicit_uri_override_supported: true
    - model: qoe
      uri_value: modelServing.qoe.uri
      storage_secret_value: modelServing.qoe.storageSecretName
      default_uri_is_placeholder: false
      default_storage_mode: existing-data-connection
      storage_path_value: modelServing.qoe.storagePath
      default_storage_path: models/starlink-qoe
      explicit_uri_override_supported: true
    feature_artifact_claim: telco-model-feature-artifacts
    database_secret_names:
    - telco-api-db
    - telco-data-generator-db
    - telco-data-readonly-db
    - telco-db-bootstrap
    - telco-migration-db
    - telco-ogx-db
    remote_llm:
      enabled_by_default: false
      base_url_chart_value: ogx-ai.models.remote-llm.url
      base_url_contract_name: REMOTE_LLM_BASE_URL
      api_key_secret_name: telco-ogx-db
      api_key_secret_key: REMOTE_LLM_API_KEY
      model_id_chart_value: api.ogxModelId
      note: Remote mode is opt-in; no credential is stored in chart values.
  lint: pass
  template: pass
  serving_runtimes:
  - telco-mlserver-lightgbm
  - telco-mlserver-onnx
  - telco-mlserver-qoe
