spec_version: 1
quickstart_name: 'Telco Revenue Assurance Agent: Quality, Churn & Fraud Insights'
slug: telco-revenue-assurance-agent
skill: rh-qs-implement
created_at: '2026-10-21T12:54:25Z'
packages:
  ui:
    env_vars:
    - name: VITE_API_BASE_URL
      description: Same-origin API base path.
      example: /api/v1
    routes:
    - path: /
      component: Dashboard
      description: Analyst dashboard for scoring runs, model metrics, results, and chat.
    services:
    - name: api_client
      file: packages/ui/src/services/api.ts
      description: Same-origin, typed OpenAPI client for backend operations.
  api:
    env_vars:
    - name: DATABASE_URL
      description: Async PostgreSQL DSN sourced from an OpenShift Secret.
      example: postgresql+asyncpg://<secret-ref>
    - name: OGX_BASE_URL
      description: Namespace-local OGX Responses API endpoint.
      example: http://ogx-ai:8321
    - name: OGX_MODEL_ID
      description: Explicit model identifier sent to OGX Responses requests.
      example: llama-3.1-8b-instruct
    - name: PREDICTION_MCP_URL
      description: Namespace-local prediction MCP endpoint.
      example: http://prediction-tools:8000/mcp
    - name: DATA_FETCH_MCP_URL
      description: Namespace-local data-fetch MCP endpoint.
      example: http://data-fetch-tool:8000/mcp
    - name: SCORING_BATCH_SIZE
      description: Maximum identifiers sent to one MCP prediction call.
      example: '100'
    endpoints:
    - method: GET
      path: /api/v1/scoring-runs
      description: List scoring runs
      request_schema: null
      response_schema: ScoringRunPage
    - method: POST
      path: /api/v1/scoring-runs
      description: Queue a scoring run
      request_schema: null
      response_schema: ScoringRunAccepted
      headers:
      - Idempotency-Key
    - method: GET
      path: /api/v1/scoring-runs/{run_id}
      description: Get scoring-run status and progress
      request_schema: null
      response_schema: ScoringRun
    - method: GET
      path: /api/v1/scoring-runs/{run_id}/results
      description: List persisted prediction results
      request_schema: null
      response_schema: PredictionResultPage
    - method: GET
      path: /api/v1/metrics
      description: Get metrics for a scoring run
      request_schema: null
      response_schema: RunMetrics
    - method: POST
      path: /api/v1/chat/sessions/{session_id}/messages
      description: Send a message to one durable agent session
      request_schema: ChatMessageRequest
      response_schema: ChatMessageResponse
    services:
    - name: chat_service
      file: packages/api/src/api/services/chat.py
      description: Per-session chat with durable request-ID and message-hash replay.
    - name: scoring_service
      file: packages/api/src/api/services/scoring.py
      description: Idempotent scoring runs, bounded MCP batches, and result pagination.
    - name: ogx_responses_client
      file: packages/api/src/api/services/ogx_client.py
      description: Typed OGX Responses API request and response validation.
    - name: mcp_clients
      file: packages/api/src/api/services/mcp_clients.py
      description: Typed clients for prediction and read-only data-fetch MCP services.
    db_models:
    - name: Customer
      file: packages/api/src/api/db/models.py
      table: customers
      fields:
      - customer_id
      - plan_type
      - dollar_weight
      - region_id
      - source_dataset_revision
      - source_features
      - created_at
      - updated_at
    - name: BillingCycle
      file: packages/api/src/api/db/models.py
      table: billing_cycles
      fields:
      - billing_cycle_id
      - customer_id
      - billing_cycle_start
      - total_bill_amount
      - source_dataset_revision
      - source_features
      - created_at
    - name: Transaction
      file: packages/api/src/api/db/models.py
      table: transactions
      fields:
      - transaction_id
      - customer_id
      - plan_type
      - is_fraud
      - source_dataset_revision
      - source_features
      - created_at
    - name: QoeSample
      file: packages/api/src/api/db/models.py
      table: qoe_samples
      fields:
      - qoe_sample_id
      - customer_id
      - region_id
      - latitude
      - longitude
      - elevation_m
      - visible_satellites
      - serving_satellites
      - signal_loss_db
      - season
      - weather
      - source_dataset_revision
      - source_features
      - created_at
    - name: ScoringRun
      file: packages/api/src/api/db/models.py
      table: scoring_runs
      fields:
      - run_id
      - idempotency_key
      - request_fingerprint
      - status
      - churn_processed_rows
      - churn_total_rows
      - fraud_processed_rows
      - fraud_total_rows
      - qoe_processed_rows
      - qoe_total_rows
      - error_code
      - created_at
      - started_at
      - completed_at
      - updated_at
    - name: ChatRequest
      file: packages/api/src/api/db/models.py
      table: chat_requests
      fields:
      - session_id
      - request_id
      - message_sha256
      - status
      - response_payload
      - created_at
      - completed_at
    - name: Prediction
      file: packages/api/src/api/db/models.py
      table: predictions
      fields:
      - prediction_id
      - scoring_run_id
      - model_type
      - customer_id
      - transaction_id
      - class_id
      - is_fraud
      - score
      - model_version
      - feature_snapshot_sha256
      - model_output
      - created_at
  prediction-tools:
    env_vars:
    - name: DATA_FETCH_MCP_URL
      description: Internal data-fetch MCP endpoint.
      example: http://data-fetch-tool:8000/mcp
    - name: CHURN_MODEL_URL
      description: Namespace-local KServe V2 churn endpoint.
      example: http://churn-prediction-predictor:8080/v2/models/churn-prediction/infer
    - name: FRAUD_MODEL_URL
      description: Namespace-local KServe V2 fraud endpoint.
      example: http://fraud-prediction-predictor:8080/v2/models/fraud-prediction/infer
    - name: QOE_MODEL_URL
      description: Namespace-local KServe V2 QoE endpoint.
      example: http://starlink-qoe-predictor:8080/v2/models/starlink-qoe/infer
    - name: CHURN_MODEL_AUTH_TOKEN
      description: Bearer token from a namespace-scoped Secret for the churn KServe endpoint.
      example: <secret-ref>
    - name: FRAUD_MODEL_AUTH_TOKEN
      description: Bearer token from a namespace-scoped Secret for the fraud KServe endpoint.
      example: <secret-ref>
    - name: QOE_MODEL_AUTH_TOKEN
      description: Bearer token from a namespace-scoped Secret for the QoE KServe endpoint.
      example: <secret-ref>
    - name: MODEL_FEATURE_MANIFEST_DIR
      description: Read-only mounted feature manifests and preprocessing sidecar references.
      example: /etc/telco-models
    services:
    - name: prediction_mcp_server
      file: packages/prediction-tools/src/prediction_tools/main.py
      description: Streamable HTTP MCP server for churn, fraud, and QoE predictions.
    - name: kserve_v2_client
      file: packages/prediction-tools/src/prediction_tools/kserve_client.py
      description: Authenticated bounded KServe V2 inference client.
    - name: feature_manifest_loader
      file: packages/prediction-tools/src/prediction_tools/features.py
      description: Validates ordered model features and preprocessing manifests.
  data-fetch-tool:
    env_vars:
    - name: DATABASE_READONLY_URL
      description: Read-only async PostgreSQL DSN sourced from an OpenShift Secret.
      example: postgresql+asyncpg://<secret-ref>
    - name: MCP_HOST
      description: Internal service bind host.
      example: 0.0.0.0
    - name: MCP_PORT
      description: Internal service port.
      example: '8000'
    - name: MAX_FETCH_ROWS
      description: Maximum rows returned by one tool call.
      example: '100'
    services:
    - name: data_fetch_mcp_server
      file: packages/data-fetch-tool/src/data_fetch_tool/main.py
      description: Streamable HTTP MCP service exposing bounded read-only customer data.
    - name: read_only_repository
      file: packages/data-fetch-tool/src/data_fetch_tool/repository.py
      description: Allowlisted PostgreSQL reads with bounded sessions and typed results.
  data-generator:
    env_vars:
    - name: DATABASE_URL
      description: Seed-writer async PostgreSQL DSN from an OpenShift Secret.
      example: postgresql+asyncpg://<secret-ref>
    - name: GENERATOR_SEED
      description: Seed for repeatable synthetic joins and regional assignment.
      example: '42'
    - name: REGIONAL_QOE_CHURN_COUPLING
      description: Tunable strength of the synthetic regional relationship.
      example: '0.4'
    - name: INGEST_BATCH_SIZE
      description: Bounded database insert/upsert batch size.
      example: '1000'
    services:
    - name: dataset_transform
      file: packages/data-generator/src/data_generator/transform.py
      description: Deterministic churn, RAFM, and QoE source-row transformation.
    - name: snapshot_writer
      file: packages/data-generator/src/data_generator/writer.py
      description: Bounded idempotent PostgreSQL upserts for the synthetic snapshot.
  common:
    env_vars: []
    services:
    - name: error_models
      file: packages/common/src/common/errors.py
      description: Shared typed errors and public error envelope models.
    - name: http_retry
      file: packages/common/src/common/http.py
      description: Bounded retry and Retry-After handling for upstream calls.
