open_questions:
- id: oq-database-schema-source
  blocking: false
  question: Final source identifiers, types, keys, QoE cardinality, nullability, and currency semantics
    remain deferred until the actual source database schema is supplied.
  current_handling: The user-approved normalized v1 schema and app.chat_requests are provisional; contracts/schema.sql,
    models, and migration must be reconciled when the source schema arrives.
- id: oq-chat-upstream-deduplication
  blocking: false
  question: After an ambiguous OGX timeout or process crash, upstream side effects cannot be safely replayed
    without OGX request-ID deduplication.
  current_handling: The API keeps the durable request claim and suppresses a duplicate OGX call; fake-store
    tests cover this behavior.
- id: oq-live-postgresql-integration
  blocking: false
  question: A live PostgreSQL integration run was not performed.
  current_handling: Persistence behavior is exercised with fakes and migration/schema parity is checked
    against the approved DDL.
- id: oq-llm-moderation-provider
  blocking: false
  question: The pinned OGX chart exposes an optional MODERATION_ENDPOINT, but no moderation provider was
    specified or configured.
  current_handling: Chat input is schema-validated and bounded to 4,000 characters; OGX is restricted
    to the four approved read/prediction MCP tools. Configure an approved moderation endpoint if required
    for deployment.
