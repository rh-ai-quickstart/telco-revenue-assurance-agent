  probe_models.py: "\"\"\"Bounded model-serving diagnostics; no application or storage\
    \ writes.\"\"\"\n\nfrom __future__ import annotations\n\nimport datetime\nimport\
    \ hashlib\nimport json\nimport math\nimport ssl\nimport sys\nfrom pathlib import\
    \ Path\nfrom typing import Any\nfrom urllib.parse import quote, urlsplit\n\nimport\
    \ httpx\n\n\ndef require(condition: bool, message: str) -> None:\n    if not condition:\n\
    \        raise ValueError(message)\n\n\ndef digest(data: bytes) -> str:\n    return\
    \ hashlib.sha256(data).hexdigest()\n\n\ndef main() -> None:\n    root = Path(\"\
    /opt/model-probe\")\n    config = json.loads((root / \"config.json\").read_text())\n\
    \    ca_path = Path(\"/etc/telco-model-ca/service-ca.crt\")\n    tls = ssl.create_default_context(cafile=str(ca_path))\n\
    \    require(\n        tls.check_hostname and tls.verify_mode == ssl.CERT_REQUIRED,\
    \ \"TLS verification required\"\n    )\n    report: dict[str, Any] = {\n     \
    \   \"observed_at\": datetime.datetime.now(datetime.UTC).isoformat(),\n      \
    \  \"scope\": \"Live HTTPS model-serving diagnostic; no application/DB writes\"\
    ,\n        \"attempt\": config[\"attempt\"],\n        \"service_account\": config[\"\
    service_account\"],\n        \"image\": config[\"image\"],\n        \"tls_verification\"\
    : {\n            \"hostname\": True,\n            \"certificate_chain\": True,\n\
    \            \"service_ca_sha256\": digest(ca_path.read_bytes()),\n        },\n\
    \        \"automatic_retries\": 0,\n        \"models\": {},\n    }\n    with httpx.Client(\n\
    \        verify=tls,\n        trust_env=False,\n        follow_redirects=False,\n\
    \        timeout=httpx.Timeout(25.0, connect=8.0),\n        transport=httpx.HTTPTransport(verify=tls,\
    \ retries=0),\n    ) as client:\n        for kind, spec in config[\"models\"].items():\n\
    \            entry: dict[str, Any] = {\n                \"status\": \"running\"\
    ,\n                \"url\": spec[\"infer_url\"],\n                \"expected_version\"\
    : spec[\"model_version\"],\n                \"checks\": {},\n            }\n \
    \           report[\"models\"][kind] = entry\n            try:\n             \
    \   url = spec[\"infer_url\"]\n                parsed = urlsplit(url)\n      \
    \          require(\n                    parsed.scheme == \"https\" and parsed.port\
    \ == 8443,\n                    \"Only the chart HTTPS 8443 model endpoint is\
    \ permitted\",\n                )\n                require(\n                \
    \    parsed.hostname is not None\n                    and parsed.hostname.endswith(\"\
    .\" + config[\"namespace\"] + \".svc\"),\n                    \"Endpoint must\
    \ be in the target namespace\",\n                )\n                require(url.endswith(\"\
    /infer\"), \"Expected inference endpoint\")\n                request_bytes = (root\
    \ / (kind + \"-request.json\")).read_bytes()\n                require(digest(request_bytes)\
    \ == spec[\"request_sha256\"], \"Input body hash mismatch\")\n               \
    \ body = json.loads(request_bytes)\n                require(body[\"inputs\"][0][\"\
    shape\"][0] == 100, \"Probe must use exactly 100 rows\")\n                metadata_url\
    \ = (\n                    url.removesuffix(\"/infer\")\n                    +\
    \ \"/versions/\"\n                    + quote(spec[\"model_version\"], safe=\"\
    \")\n                )\n                for check, method, target, payload in\
    \ [\n                    (\"anonymous_metadata_denied\", \"GET\", metadata_url,\
    \ None),\n                    (\"anonymous_inference_denied\", \"POST\", url,\
    \ body),\n                ]:\n                    response = client.request(method,\
    \ target, json=payload)\n                    entry[\"checks\"][check] = {\n  \
    \                      \"status\": \"pass\" if response.status_code in (401, 403)\
    \ else \"fail\",\n                        \"http_status\": response.status_code,\n\
    \                        \"body_sha256\": digest(response.content),\n        \
    \            }\n                token_path = Path(\"/var/run/telco-model-auth\"\
    ) / kind / \"token\"\n                token = token_path.read_text().strip()\n\
    \                require(bool(token), \"Controller token is empty\")\n       \
    \         headers = {\"Authorization\": \"Bearer \" + token}\n               \
    \ response = client.get(metadata_url, headers=headers)\n                entry[\"\
    checks\"][\"authorized_versioned_metadata\"] = {\n                    \"status\"\
    : \"pass\" if response.status_code == 200 else \"fail\",\n                   \
    \ \"http_status\": response.status_code,\n                    \"body_sha256\"\
    : digest(response.content),\n                }\n                require(response.status_code\
    \ == 200, \"Authorized version-specific metadata failed\")\n                metadata\
    \ = response.json()\n                require(metadata.get(\"name\") == spec[\"\
    model_name\"], \"Metadata name mismatch\")\n                entry[\"metadata\"\
    ] = {\n                    key: metadata[key]\n                    for key in\
    \ (\"name\", \"platform\", \"versions\", \"inputs\", \"outputs\")\n          \
    \          if key in metadata\n                }\n                entry[\"metadata_version_note\"\
    ] = (\n                    \"Version-specific metadata URL returned 200; metadata.versions\
    \ describes \"\n                    \"runtime dependencies. Inference model_version\
    \ is checked separately.\"\n                )\n                response = client.post(url,\
    \ headers=headers, json=body)\n                entry[\"checks\"][\"authorized_inference\"\
    ] = {\n                    \"status\": \"pass\" if response.status_code == 200\
    \ else \"fail\",\n                    \"http_status\": response.status_code,\n\
    \                    \"body_sha256\": digest(response.content),\n            \
    \    }\n                require(response.status_code == 200, \"Authorized inference\
    \ failed\")\n                result = response.json()\n                require(result.get(\"\
    id\") == body[\"id\"], \"Response ID mismatch\")\n                require(result.get(\"\
    model_name\") == spec[\"model_name\"], \"Model name mismatch\")\n            \
    \    require(\n                    result.get(\"model_version\") == spec[\"model_version\"\
    ], \"Model version mismatch\"\n                )\n                outputs = result.get(\"\
    outputs\")\n                require(isinstance(outputs, list) and len(outputs)\
    \ == 1, \"Expected one output\")\n                output = outputs[0]\n      \
    \          require(output.get(\"name\") == spec[\"output_tensor_name\"], \"Output\
    \ name mismatch\")\n                require(\n                    output.get(\"\
    datatype\") == spec[\"output_datatype\"], \"Output datatype mismatch\"\n     \
    \           )\n                require(output.get(\"shape\") == [100, 1], \"Output\
    \ shape mismatch\")\n                require(\n                    output.get(\"\
    parameters\") == {\"content_type\": \"np\"}, \"Codec parameters mismatch\"\n \
    \               )\n                values = output.get(\"data\")\n           \
    \     require(\n                    isinstance(values, list) and len(values) ==\
    \ 100, \"Output data count mismatch\"\n                )\n                expected\
    \ = spec[\"expected_values\"]\n                require(len(expected) == 100, \"\
    Local reference count mismatch\")\n                for value in values:\n    \
    \                require(\n                        type(value) in (int, float)\
    \ and math.isfinite(value),\n                        \"Output must be finite numeric\"\
    ,\n                    )\n                    if kind == \"fraud\":\n        \
    \                require(type(value) is int and value in (0, 1), \"Invalid fraud\
    \ class\")\n                    else:\n                        require(\n    \
    \                        0 <= value <= (1 if kind == \"churn\" else 100),\n  \
    \                          \"Output outside model range\",\n                 \
    \       )\n                close = all(\n                    math.isclose(a, b,\
    \ rel_tol=1e-5, abs_tol=1e-5)\n                    for a, b in zip(values, expected,\
    \ strict=True)\n                )\n                require(close, \"Live output\
    \ differs from actual local runtime reference\")\n                entry[\"checks\"\
    ][\"wire_contract_and_reference\"] = {\"status\": \"pass\"}\n                entry[\"\
    response\"] = {\n                    \"id\": result[\"id\"],\n               \
    \     \"model_name\": result[\"model_name\"],\n                    \"model_version\"\
    : result[\"model_version\"],\n                    \"outputs\": [\n           \
    \             {\n                            key: output[key]\n              \
    \              for key in (\"name\", \"datatype\", \"shape\", \"parameters\",\
    \ \"data\")\n                        }\n                    ],\n             \
    \   }\n                entry[\"summary\"] = {\n                    \"rows\": len(values),\n\
    \                    \"minimum\": min(values),\n                    \"maximum\"\
    : max(values),\n                    \"maximum_absolute_difference_vs_local\":\
    \ max(\n                        abs(a - b) for a, b in zip(values, expected, strict=True)\n\
    \                    ),\n                    \"request_sha256\": spec[\"request_sha256\"\
    ],\n                    \"source_training_artifact_sha256\": spec[\"source_training_artifact_sha256\"\
    ],\n                }\n                if kind == \"churn\":\n               \
    \     entry[\"summary\"][\"positive_class_count_probability_gt_half\"] = sum(\n\
    \                        v > 0.5 for v in values\n                    )\n    \
    \            if kind == \"fraud\":\n                    entry[\"summary\"][\"\
    positive_class_count\"] = sum(values)\n                entry[\"status\"] = (\n\
    \                    \"pass\"\n                    if all(check[\"status\"] ==\
    \ \"pass\" for check in entry[\"checks\"].values())\n                    else\
    \ \"fail\"\n                )\n            except Exception as error:\n      \
    \          entry[\"status\"] = \"fail\"\n                entry[\"error_type\"\
    ] = type(error).__name__\n                # Only our own fixed assertion text\
    \ is safe to print. Provider exceptions\n                # and response bodies\
    \ are omitted to avoid logging tokens or headers.\n                if type(error)\
    \ is ValueError:\n                    entry[\"error\"] = str(error)\n    report[\"\
    status\"] = (\n        \"pass\" if all(item[\"status\"] == \"pass\" for item in\
    \ report[\"models\"].values()) else \"fail\"\n    )\n    report[\"finished_at\"\
    ] = datetime.datetime.now(datetime.UTC).isoformat()\n    text = json.dumps(report,\
    \ sort_keys=True, allow_nan=False)\n    sys.stdout.write(text + \"\\n\")\n   \
    \ sys.stdout.flush()\n    if report[\"status\"] != \"pass\":\n        raise SystemExit(1)\n\
    \n\nif __name__ == \"__main__\":\n    main()\n"
