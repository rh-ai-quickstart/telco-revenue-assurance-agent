apiVersion: batch/v1
kind: Job
metadata:
  name: telco-model-probe-3c43ff12216a
  namespace: telco-revenue-assurance-agent
  labels:
    telco.redhat.com/diagnostic: model-probe
    telco.redhat.com/probe-id: 3c43ff12216a
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telco-revenue-assurance-agent
        app.kubernetes.io/instance: telco-revenue-assurance-agent
        app.kubernetes.io/component: prediction-tools
        telco.redhat.com/diagnostic: model-probe
        telco.redhat.com/probe-id: 3c43ff12216a
    spec:
      serviceAccountName: telco-revenue-assurance-agent-prediction-tools
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: model-probe
        image: quay.io/yelias/prediction-tools@sha256:64f3e41745b315369b8e004d01074c3fa8c87f3d93e9c7f601f8f9e71c56036f
        imagePullPolicy: IfNotPresent
        command:
        - python
        - /opt/model-probe/probe_models.py
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: TMPDIR
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: probe
          mountPath: /opt/model-probe
          readOnly: true
        - name: model-service-ca
          mountPath: /etc/telco-model-ca
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: churn-auth
          mountPath: /var/run/telco-model-auth/churn
          readOnly: true
        - name: fraud-auth
          mountPath: /var/run/telco-model-auth/fraud
          readOnly: true
        - name: qoe-auth
          mountPath: /var/run/telco-model-auth/qoe
          readOnly: true
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - raise SystemExit(1)
          periodSeconds: 5
          failureThreshold: 1
      volumes:
      - name: probe
        configMap:
          name: telco-model-probe-3c43ff12216a
      - name: model-service-ca
        configMap:
          name: openshift-service-ca.crt
          items:
          - key: service-ca.crt
            path: service-ca.crt
      - name: tmp
        emptyDir: {}
      - name: churn-auth
        secret:
          secretName: telco-churn-model-auth
          items:
          - key: token
            path: token
      - name: fraud-auth
        secret:
          secretName: telco-fraud-model-auth
          items:
          - key: token
            path: token
      - name: qoe-auth
        secret:
          secretName: telco-qoe-model-auth
          items:
          - key: token
            path: token
