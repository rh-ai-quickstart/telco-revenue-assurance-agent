# ─── Header ───────────────────────────────────────────────────
spec_version: 1
quickstart_name: "Telco Revenue Assurance Agent: Quality, Churn & Fraud Insights"
slug: telco-revenue-assurance-agent
skill: rh-qs-architect
created_at: "2026-09-23T00:00:00Z"

# ─── Technology Stack ─────────────────────────────────────────
technology_stack:
  frontend: "React 19 with TypeScript, Vite build, TanStack Router/Query for routing and state management"
  backend: "FastAPI with Python 3.12+, UV package manager, Pydantic v2 for validation, SQLAlchemy 2 async ORM"
  database: "PostgreSQL"
  vector_db: "Not required (no vector search or RAG in v1)"
  llm_orchestration: "OGX via ai-architecture-charts/ogx-ai"
  model_serving: "On-cluster vLLM for Llama 3.1 8B via ai-architecture-charts/llm-service, with optional remote OpenAI-compatible fallback; KServe V2 with MLServer LightGBM for churn and ONNX for RAFM fraud and Starlink QoE"
  object_storage: "External S3-compatible storage is required for the existing KServe model artifacts; credentials and artifact paths are deployment inputs, and this chart does not deploy storage"
  local_runtime: "Not required (OpenShift AI only deployment target)"
  monorepo: "Turborepo with pnpm and uv"
  deploy_platform: "Red Hat OpenShift AI"

# ─── Components ───────────────────────────────────────────────
components:
  frontend:
    type: ui
    role: "Revenue assurance analyst dashboard with chat interface for querying predictions and viewing aggregated metrics"
    technology: "React 19, TypeScript, Vite"
    delivery: application

    constraints:
      - "No latency SLA for chat responses in v1"
      - "Dashboard displays summary metrics from on-demand scoring runs"

    kb_sources:
      - path: components/react-frontend.md
        match_reason: "React UI component patterns with TanStack Router/Query for dashboard and chat"

    dependencies:
      - component: backend
        reason: "Consumes REST API for scoring triggers, metrics queries, and chat sessions"

  backend:
    type: backend
    role: "FastAPI server orchestrating agent sessions, prediction tool execution, database queries, and scoring workflows"
    technology: "FastAPI, Python 3.12+, Pydantic v2, SQLAlchemy 2 async"
    delivery: application

    constraints:
      - "Handles on-demand scoring only; no scheduled jobs in v1"
      - "Calls prediction-tools and data-fetch-tool through their MCP contracts; it does not call model endpoints directly"
      - "Persists scoring-run status and prediction results for the dashboard"

    kb_sources:
      - path: components/fastapi-backend.md
        match_reason: "FastAPI backend patterns for agent orchestration, tool execution, and database access"
      - path: architectures/agent-orchestration.md
        match_reason: "Agent orchestration patterns for tool-calling workflows"

    dependencies:
      - component: agent-orchestration
        reason: "Delegates chat sessions to OGX for LLM reasoning and tool dispatch"
      - component: database
        reason: "Queries database directly for dashboard metrics"
      - component: prediction-tools
        reason: "Invokes prediction tools for churn/fraud/QoE analysis"
      - component: data-fetch-tool
        reason: "Invokes data-fetch tool for direct database queries from backend endpoints"

  agent-orchestration:
    type: inference
    role: "OGX agent runtime managing tool calling, LLM reasoning, and session state for analyst queries"
    technology: "OGX (formerly Llama Stack)"
    delivery: chart

    chart:
      name: ai-architecture-charts/ogx-ai
      version: "0.8.6"

    rhoai_features:
      - feature: "OGX (Technology Preview)"
        purpose: "Unified gen-AI runtime for agent orchestration with tool calling and OpenAI-compatible APIs"

    constraints:
      - "Agent uses four explicitly allowlisted tools across the prediction-tools and data-fetch-tool MCP services: predict_churn, predict_fraud, predict_qoe, and fetch_customer_data"
      - "MCP endpoints use streamable HTTP and remain internal to the release namespace"
      - "Conversation and metadata state use PostgreSQL; SQLite and in-memory persistence are disabled"
      - "Tools abstract serving protocols and database schema from the agent"

    kb_sources:
      - path: components/llamastack.md
        match_reason: "LlamaStack/OGX orchestration patterns for agents and tool calling"
      - path: architectures/agent-orchestration.md
        match_reason: "Agent orchestration patterns for tool-calling workflows"
      - path: architectures/mcp-tool-integration.md
        match_reason: "Tool integration patterns for caching implementation"

    dependencies:
      - component: llm-serving
        reason: "Consumes LLM inference for reasoning and response generation"
      - component: database
        reason: "Persists OGX metadata and conversation state in PostgreSQL"
      - component: prediction-tools
        reason: "Invokes prediction tools registered in the OGX runtime"
      - component: data-fetch-tool
        reason: "Invokes data-fetch tool for customer data queries"

  llm-serving:
    type: inference
    role: "vLLM serving Llama 3.1 8B Instruct for agent reasoning and text generation"
    technology: "vLLM"
    delivery: chart

    chart:
      name: ai-architecture-charts/llm-service
      version: "0.1.0"

    rhoai_features:
      - feature: "Model serving platform (KServe)"
        purpose: "KServe InferenceService for vLLM deployment with GPU support"

    constraints:
      - "GPU is optional; use the on-cluster Llama 3.1 8B endpoint when resources are available, otherwise configure a remote OpenAI-compatible endpoint"
      - "Model sized for L4/A10 class GPU"
      - "Model selection (Llama 3.1 8B) can be changed in future without agent code changes"

    kb_sources:
      - path: components/vllm.md
        match_reason: "vLLM serving patterns for Llama models on KServe"
      - path: components/model-serving.md
        match_reason: "Model serving deployment patterns for vLLM and KServe integration"

    dependencies: []

  database:
    type: database
    role: "PostgreSQL storing customer profiles, every churn billing-cycle row, every RAFM transaction, QoE source samples, scoring runs, prediction results, OGX session state, and backend chat idempotency records"
    technology: "PostgreSQL 17 with the pgvector extension (vector search is unused in v1)"
    delivery: chart

    chart:
      name: ai-architecture-charts/pgvector
      version: "0.1.0"

    constraints:
      - "Preserves all source rows: about 113k churn billing cycles, 100k QoE samples, and 1M RAFM transactions"
      - "Customer dollar weight = mean of TotalBillAmount across all billing cycles per CustomerID"
      - "Churn scoring uses the latest BillingCycleStart per customer"
      - "Provisional v1 domain tables: customers, billing_cycles, transactions, qoe_samples, scoring_runs, and predictions; app.chat_requests separately stores session-scoped request hashes and completed response payloads for backend retry idempotency"
      - "The schema preserves every source row; stable query and model fields are typed, with evolving raw source features retained losslessly in JSONB"
      - "Schema is managed by versioned migrations; data-fetch uses a read-only database role"
      - "Regional coupling between QoE and churn is tunable and intentional"

    kb_sources:
      - path: components/pgvector.md
        match_reason: "PostgreSQL deployment patterns for relational data with synthetic data seeding strategies"

    dependencies: []

  churn-model-serving:
    type: inference
    role: "KServe V2 endpoint serving the existing LightGBM churn model for the latest billing cycle per customer"
    technology: "MLServer LightGBM runtime with the native model.bst artifact"
    delivery: rhoai

    rhoai_features:
      - feature: "Model serving platform (KServe)"
        purpose: "KServe V2 InferenceService using the supplied MLServer LightGBM v4 runtime and native model.bst artifact"

    constraints:
      - "Uses the existing trained artifact; no retraining in v1"
      - "Serves the KServe V2 FP32 feature matrix and INT64 class output defined by the serving artifact"
      - "Preprocessing uses the supplied PaymentStatus, PrimaryIssueType, and SupportChannel mappings and drops HasChurned, cycle/date columns, and CustomerID"
      - "The ordered semantic feature manifest must match the artifact; prediction-tools validates its width before inference"
      - "Artifact storage URI and namespace-scoped S3 connection are deployment values, never committed credentials"

    kb_sources:
      - path: architectures/model-serving-gateway.md
        match_reason: "Model serving patterns for KServe with native runtime assessment"
      - path: deployment/helm-kserve-runtime-deployer-job-inline-rbac.md
        match_reason: "Runtime switching strategies for KServe deployment"
      - path: deployment/container-build-mlserver-model-unwrap-multistage.md
        match_reason: "Artifact format handling for MLServer sklearn runtime"

    dependencies: []

  fraud-model-serving:
    type: inference
    role: "KServe V2 endpoint serving the existing RAFM fraud classifier per transaction"
    technology: "ONNX BalancedRandomForest artifact with MLServer runtime"
    delivery: rhoai

    rhoai_features:
      - feature: "Model serving platform (KServe)"
        purpose: "KServe V2 InferenceService using the supplied MLServer ONNX runtime and RAFM fraud ONNX artifact"

    constraints:
      - "Uses the existing trained artifact; no retraining in v1"
      - "Consumes the ONNX FP32 feature vector and returns the trained binary class output"
      - "The ONNX class order is [False, True], mapped to Non-Fraud and Fraud respectively"
      - "Preprocessing applies the training-time Plan_Type one-hot transform with drop_first semantics; the ordered feature manifest must match the artifact"
      - "Artifact storage URI and namespace-scoped S3 connection are deployment values, never committed credentials"

    kb_sources:
      - path: architectures/model-serving-gateway.md
        match_reason: "Model serving patterns for KServe with native runtime assessment"
      - path: deployment/helm-kserve-mlserver-sklearn-minio-rawdeployment.md
        match_reason: "KServe InferenceService deployment patterns with MLServer"

    dependencies: []

  qoe-model-serving:
    type: inference
    role: "KServe V2 endpoint serving the existing Starlink QoE score model for a customer location"
    technology: "ONNX transformer with MLServer runtime"
    delivery: rhoai

    rhoai_features:
      - feature: "Model serving platform (KServe)"
        purpose: "KServe V2 InferenceService using MLServer ONNX for the Starlink QoE artifact; preprocessing sidecars are read from the configured S3 artifact prefix"

    constraints:
      - "Uses the existing trained artifact; no retraining in v1"
      - "KServe receives latitude, longitude, elevation_m, visible_satellites, serving_satellites, signal_loss_db, season_encoded, and weather_encoded in that order after StandardScaler and season/weather label encoding"
      - "The ONNX V2 input is FP32 with shape [batch, 1, 8] and returns one QoE score in the model's 0–100 range per row"
      - "The scaler and label-encoder artifacts are read from the configured model-artifact prefix by prediction-tools"
      - "Current limitation: uses satellite internet data; telecom QoE data is a future enhancement"
      - "Artifact storage URI and namespace-scoped S3 connection are deployment values, never committed credentials"

    kb_sources:
      - path: architectures/model-serving-gateway.md
        match_reason: "Model serving patterns for KServe with native runtime assessment"
      - path: deployment/makefile-multi-image-runtime-type-deploy-switch.md
        match_reason: "Runtime switching strategies for deployment"

    dependencies: []

  prediction-tools:
    type: worker
    role: "FastMCP service exposing predict_churn, predict_fraud, and predict_qoe while hiding model-serving details from callers"
    technology: "Python FastMCP over streamable HTTP, KServe V2 clients, and bounded result caching"
    delivery: application

    constraints:
      - "MCP tools accept bounded customer or transaction identifiers and return typed domain results"
      - "The service obtains model features through data-fetch-tool and validates model feature manifests before calling KServe V2"
      - "Tool caching is keyed by prediction type, subject, model version, and feature snapshot; failures are not cached"
      - "The MCP service exposes no arbitrary model URL, database query, or cluster operation"

    kb_sources:
      - path: architectures/mcp-tool-integration.md
        match_reason: "Tool integration patterns for caching implementation addressing deployment question 1"

    dependencies:
      - component: data-fetch-tool
        reason: "Fetches required fields for each customer ID before calling model endpoints"
      - component: churn-model-serving
        reason: "Calls churn model endpoint (protocol abstracted)"
      - component: fraud-model-serving
        reason: "Calls fraud model endpoint (protocol abstracted)"
      - component: qoe-model-serving
        reason: "Calls QoE model endpoint (protocol abstracted)"

  data-fetch-tool:
    type: worker
    role: "Read-only FastMCP service exposing fetch_customer_data for allowlisted customer and transaction records"
    technology: "Python FastMCP over streamable HTTP with async SQLAlchemy queries"
    delivery: application

    constraints:
      - "Serves the backend, prediction-tools, and OGX through one MCP contract"
      - "Accepts bounded IDs, allowlisted entity types, field aliases, and filters; returns typed structured records"
      - "Uses read-only database credentials and never executes caller-supplied SQL"
      - "Hides database schema details from OGX and prediction-tools"

    kb_sources:
      - path: components/fastapi-backend.md
        match_reason: "Database access patterns with SQLAlchemy async for structured queries"

    dependencies:
      - component: database
        reason: "Queries customer and transaction tables via SQLAlchemy"

  data-generator:
    type: worker
    role: "Python worker generating and joining customer, billing-cycle, QoE-sample, and RAFM transaction data from Hugging Face datasets"
    technology: "Python script"
    delivery: application

    constraints:
      - "Generates from 3 HuggingFace datasets: Omer1234567/telco-churn-synthetic (~113k rows), fenar/starlink (100k), fenar/revenue_assurance (1M)"
      - "Joins with customer_id (many transactions to one customer)"
      - "Assigns Starlink coordinates to customers grouped into regions with tunable QoE-churn coupling"
      - "Generates season/weather per region (same area gets same/close values at synthetic snapshot time)"
      - "Dollar weight per customer = mean of TotalBillAmount across all billing cycles"
      - "Per-customer consistency for columns that should not vary across transactions"
      - "No empty required fields (fill from empirical probability)"
      - "Regional outlier is not hardcoded to specific region"

    kb_sources:
      - path: deployment/helm-seed-job-dual-curl-python-rag-ingestion.md
        match_reason: "Data seeding job patterns for synthetic dataset generation addressing deployment question 2"

    dependencies:
      - component: database
        reason: "Populates customers and transactions tables"

# ─── Integration & Data Flow ──────────────────────────────────
integration_patterns:
  protocols:
    - pair: "Frontend → Backend"
      protocol: "REST over HTTPS through the authenticated Route; OpenAPI contract under /api/v1"
    - pair: "Backend → OGX"
      protocol: "OpenAI-compatible Responses API over namespace-local HTTP"
    - pair: "OGX → vLLM"
      protocol: "OpenAI-compatible HTTP API (vLLM /v1 endpoint)"
    - pair: "Backend → prediction-tools and data-fetch-tool"
      protocol: "MCP over streamable HTTP/JSON-RPC for on-demand scoring and API data queries"
    - pair: "OGX → prediction-tools and data-fetch-tool"
      protocol: "MCP over streamable HTTP/JSON-RPC; only four domain tools are allowlisted"
    - pair: "Prediction tools → data-fetch-tool"
      protocol: "MCP over streamable HTTP/JSON-RPC for allowlisted model features"
    - pair: "Prediction tools → churn/fraud/QoE model services"
      protocol: "KServe V2 HTTP inference; feature order and transformations come from model manifests"
    - pair: "Backend → PostgreSQL"
      protocol: "Async SQLAlchemy over PostgreSQL for metrics, scoring runs, and persisted predictions"
    - pair: "OGX → PostgreSQL"
      protocol: "PostgreSQL-backed metadata and conversation state; SQLite fallback is disabled"
    - pair: "Data-fetch-tool → PostgreSQL"
      protocol: "Async SQLAlchemy over PostgreSQL with a read-only database role and allowlisted fields"
    - pair: "Data-generator → PostgreSQL"
      protocol: "Async SQLAlchemy over PostgreSQL with bounded, idempotent writes"

  data_flows:
    - name: "Revenue assurance analysis"
      path: "Frontend → Backend → OGX Responses API → vLLM; OGX calls prediction-tools and data-fetch-tool over MCP; tools query PostgreSQL or KServe as needed"
    - name: "On-demand scoring run"
      path: "Frontend → Backend → prediction-tools over MCP → data-fetch-tool over MCP → PostgreSQL and KServe; Backend persists run status and prediction results"
    - name: "Agent data query"
      path: "Frontend → Backend → OGX → data-fetch-tool over MCP → PostgreSQL → structured response"
    - name: "Agent session persistence"
      path: "Backend → OGX Responses API → OGX PostgreSQL metadata and conversation state"
    - name: "Dashboard metrics query"
      path: "Frontend → Backend → PostgreSQL → metrics response"
    - name: "Model prediction with caching"
      path: "prediction-tools cache check → data-fetch-tool and KServe V2 (on cache miss) → typed cached result"
    - name: "Data initialization"
      path: "Data generator → PostgreSQL (customer profiles, billing cycles, QoE samples, and transactions)"

  security_boundaries:
    - point: "Browser → Frontend/API Route"
      mechanism: "OpenShift OAuth-protected Route; browser API calls use the same-origin /api/v1 path, and the backend trusts identity only from the configured trusted ingress/proxy"
    - point: "Backend/OGX → MCP services"
      mechanism: "Namespace-local Services, no public Route; explicit tool allowlist and bounded request sizes"
    - point: "MCP data access"
      mechanism: "Read-only PostgreSQL credentials and allowlisted fields, entity types, filters, and result limits"
    - point: "Backend/OGX/data generator → PostgreSQL"
      mechanism: "Dedicated namespace-scoped ServiceAccounts and OpenShift Secret references; separate least-privilege database roles for application writes, OGX state, and seeding"
    - point: "Data-fetch-tool → PostgreSQL"
      mechanism: "Read-only database credentials, allowlisted fields and filters, bounded result sizes"
    - point: "OGX → LLM endpoint"
      mechanism: "On-cluster vLLM by default; a remote endpoint's credential is supplied only through an OpenShift Secret"
    - point: "Prediction tools → KServe models"
      mechanism: "Authenticated namespace-local KServe V2 endpoints and network policies"
    - point: "Model artifacts"
      mechanism: "Existing namespace-scoped S3 connection Secret; read-only access, with no credential values in Git"

security_considerations:
  cluster_access:
    target_namespace: "Single release namespace supplied at deployment"
    agent_profile: "local-only; chart preparation uses Helm/Makefile targets and no direct cluster API access"
    app_mcp_allowlist: [predict_churn, predict_fraud, predict_qoe, fetch_customer_data]
    cluster_operations_exposed_to_agent: false
  application:
    secrets: "Database, LLM, KServe, and S3 credentials are referenced from OpenShift Secrets; values.yaml contains no secret values"
    service_accounts: "Dedicated namespace-scoped identities per workload; no cluster-admin or unnecessary Kubernetes API access"
    user_input: "Validate request sizes, identifiers, field aliases, filters, and chat input; reject arbitrary SQL and arbitrary endpoint URLs"
    model_artifacts: "S3 credentials are read-only for serving and preprocessing; model artifacts are trusted deployment inputs"

# ─── Architecture Diagram ─────────────────────────────────────
architecture_diagram_path: .qs-factory/designs/architecture-diagram.mmd

# ─── Testing Strategy ─────────────────────────────────────────
testing_strategy:
  profile: standard

  unit_tests:
    python:
      scope: "Routes, schemas, services, prediction tools, data generator logic"
      runs_on: "Every PR (pr-checks / ci.yaml)"
    typescript:
      scope: "Components, hooks, dashboard rendering"
      runs_on: "Every PR"

  integration_tests:
    scope: "API + DB + in-cluster services (OGX agent, prediction tools, KServe models)"
    runs_on: "PR E2E workflow (rh-qs-test-suite)"

  e2e_tests:
    scope: "Canned demo questions (why high churn, fraud overlap, priority region) against synthetic data"
    runs_on: "pull_request_target or nightly"

  helm_validation:
    scope: "Exported manifests valid (chart linting, template rendering)"
    runs_on: "Every PR"

