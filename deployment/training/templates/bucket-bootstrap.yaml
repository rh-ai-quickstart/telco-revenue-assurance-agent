{{- $pipeline := index .Values "configure-pipeline" -}}
{{- $storage := index $pipeline "aws-compatible-storage" -}}
{{- if not $storage.enabled -}}
{{- fail "This optional training chart requires its bundled storage; use an existing DSPA directly for external training infrastructure." -}}
{{- end -}}
{{- if or $pipeline.notebook.create $pipeline.secret.create $storage.sampleFileUpload.enabled -}}
{{- fail "Keep notebook.create, secret.create and sampleFileUpload.enabled false for the Telco training release." -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bucket-bootstrap
  labels:
    {{- include "telco-training.labels" . | nindent 4 }}
    app.kubernetes.io/component: bucket-bootstrap
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.bucketBootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "telco-training.labels" . | nindent 8 }}
        app.kubernetes.io/component: bucket-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-buckets
          image: {{ .Values.bucketBootstrap.image | quote }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              python3 -m pip install --disable-pip-version-check --target /tmp/python 'boto3==1.43.119'
              PYTHONPATH=/tmp/python python3 - <<'PY'
              import json
              import os
              import time

              import boto3
              from botocore.config import Config
              from botocore.exceptions import BotoCoreError, ClientError

              client = boto3.client(
                  "s3",
                  endpoint_url=os.environ["AWS_S3_ENDPOINT"],
                  region_name=os.environ["AWS_DEFAULT_REGION"],
                  config=Config(
                      connect_timeout=5,
                      read_timeout=10,
                      retries={"max_attempts": 2},
                      s3={"addressing_style": "path"},
                  ),
              )
              for attempt in range(36):
                  try:
                      client.list_buckets()
                      break
                  except (BotoCoreError, ClientError):
                      if attempt == 35:
                          raise RuntimeError("Storage did not become reachable before the bootstrap deadline") from None
                      time.sleep(5)
              for bucket in json.loads(os.environ["BUCKETS_JSON"]):
                  try:
                      client.head_bucket(Bucket=bucket)
                  except ClientError as error:
                      code = error.response.get("Error", {}).get("Code")
                      if code not in {"404", "NoSuchBucket", "NotFound"}:
                          raise RuntimeError(f"Cannot verify bucket {bucket}: {code}") from None
                      try:
                          client.create_bucket(Bucket=bucket)
                      except ClientError as error:
                          if error.response.get("Error", {}).get("Code") != "BucketAlreadyOwnedByYou":
                              raise RuntimeError(f"Cannot create bucket {bucket}") from None
                      client.head_bucket(Bucket=bucket)
                  print(f"Verified bucket: {bucket}")
              PY
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "telco-training.storageSecret" . }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "telco-training.storageSecret" . }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: {{ include "telco-training.storageEndpoint" . | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ $storage.s3.region | quote }}
            - name: BUCKETS_JSON
              value: {{ list $pipeline.pipelineStorage.externalStorage.bucket .Values.bucketBootstrap.modelBucket | uniq | toJson | quote }}
          resources:
            {{- toYaml .Values.bucketBootstrap.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
