{{- $pipeline := index .Subcharts "configure-pipeline" -}}
{{- $storage := index $pipeline.Subcharts "aws-compatible-storage" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-storage-ingress
  labels:
    {{- include "telco-training.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aws-compatible-storage.selectorLabels" $storage | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: s3-api
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.operatorNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: data-science-pipelines-operator
        - podSelector:
            matchLabels:
              component: data-science-pipelines
        - podSelector:
            matchLabels:
              pipelines.kubeflow.org/v2_component: "true"
        - podSelector:
            matchLabels:
              {{- include "telco-training.labels" . | nindent 14 }}
              app.kubernetes.io/component: bucket-bootstrap
        - podSelector:
            matchExpressions:
              - key: serving.kserve.io/inferenceservice
                operator: In
                values: [churn-prediction, fraud-prediction, starlink-qoe]
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: telco-revenue-assurance-agent
              app.kubernetes.io/component: model-artifact-loader
