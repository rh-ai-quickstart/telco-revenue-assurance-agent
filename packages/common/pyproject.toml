[project]
name = "telco-qs-common"
version = "0.1.0"
description = "Shared typed settings, models, errors, HTTP, and logging for the quickstart."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.ruff]
extend = "../configs/ruff.toml"
