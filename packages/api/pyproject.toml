[project]
name = "telco-revenue-assurance-api"
version = "0.1.0"
description = "FastAPI service for telco revenue assurance scoring and analyst chat."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "fastmcp>=3.4,<5",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "telco-data-fetch-tool",
  "telco-qs-common",
  "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
telco-data-fetch-tool = { workspace = true }
telco-qs-common = { workspace = true }

[tool.ruff]
extend = "../configs/ruff.toml"
