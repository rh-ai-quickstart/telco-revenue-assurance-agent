target-version = "py312"
line-length = 100
src = ["packages"]
extend-exclude = ["../common/API.md"]

[lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "S",
  "T20",
  "PT",
  "ASYNC",
  "RUF",
  "ANN",
]

[lint.per-file-ignores]
"test_*.py" = ["S101"]
"*_test.py" = ["S101"]

[lint.isort]
known-first-party = ["common"]

[format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"
