[project]
name = "telco-prediction-tools"
version = "0.1.0"
description = "Authenticated FastMCP tools for telco churn, fraud, and QoE inference."
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=3.4,<5",
  "httpx>=0.28,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "scikit-learn>=1.5,<2",
  "telco-data-fetch-tool",
  "telco-qs-common",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_tools"]

[tool.uv.sources]
telco-data-fetch-tool = { workspace = true }
telco-qs-common = { workspace = true }

[tool.ruff]
extend = "../configs/ruff.toml"
