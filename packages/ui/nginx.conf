pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_body_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /api/v1 {
      return 308 /api/v1/;
    }

    location /api/v1/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 125s;
      proxy_read_timeout 125s;
      proxy_redirect off;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-User $http_x_forwarded_user;
      proxy_set_header X-Forwarded-Email "";
      proxy_set_header X-Forwarded-Preferred-Username "";
      proxy_set_header X-Forwarded-Groups "";
      proxy_set_header X-Forwarded-Access-Token "";
      proxy_set_header X-Forwarded-User-Id "";
      proxy_set_header X-Auth-Request-User "";
      proxy_set_header X-Auth-Request-Email "";
      proxy_set_header X-Auth-Request-Groups "";
      proxy_set_header X-Auth-Request-Access-Token "";
      proxy_set_header X-Remote-User "";
      proxy_set_header X-Remote-Email "";
      proxy_set_header Authorization "";
      proxy_set_header Proxy-Authorization "";
      proxy_set_header Cookie "";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
